<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TOURNAMENT</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f0a500">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tournament">
  <link rel="apple-touch-icon" href="icon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    * { -webkit-tap-highlight-color: transparent; }

    :root {
      --bg:          #08080c;
      --bg-card:     #0e0e14;
      --bg-input:    #0a0a0f;
      --border:      #222230;
      --border-dim:  #16161f;
      --gold:        #f0a500;
      --gold-soft:   #fbbf24;
      --gold-glow:   rgba(240,165,0,.18);
      --text:        #f4f4f6;
      --muted:       #6b6b80;
      --subtle:      #2e2e3a;
      --accent:      #7c6cff;
      --doubles:     #6caaff;
    }

    body {
      font-family: 'Inter', 'Meiryo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ━━━━ SETUP ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    #setup {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
    }

    .hero { text-align: center; margin-bottom: 52px; }

    .hero-icon {
      display: inline-block;
      font-size: 2.8rem;
      margin-bottom: 18px;
      filter: drop-shadow(0 0 28px rgba(240,165,0,.55));
      animation: floatIcon 3s ease-in-out infinite;
    }

    @keyframes floatIcon {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    .hero-title {
      font-size: 3.4rem;
      font-weight: 900;
      letter-spacing: -.05em;
      line-height: 1;
      background: linear-gradient(160deg, #fff 30%, #6b6b80);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-sub {
      margin-top: 10px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color .3s;
    }
    .hero-sub.is-doubles { color: var(--doubles); }

    .setup-panel {
      width: 100%;
      max-width: 480px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.03) inset;
    }

    /* ── モード切替トグル ── */
    .mode-toggle {
      display: flex;
      gap: 0;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 28px;
    }
    .mode-btn {
      flex: 1;
      border: none;
      border-radius: 9px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: .04em;
      padding: 10px 12px;
      cursor: pointer;
      transition: all .2s;
      background: transparent;
      color: var(--muted);
      touch-action: manipulation;
    }
    .mode-btn.active {
      background: linear-gradient(135deg, var(--gold), #c47d00);
      color: #000;
      box-shadow: 0 2px 12px rgba(240,165,0,.3);
    }
    .mode-btn.active.doubles-active {
      background: linear-gradient(135deg, var(--doubles), #3a7ad4);
      color: #fff;
      box-shadow: 0 2px 12px rgba(108,170,255,.3);
    }

    .lbl {
      display: block;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .field-row { display: flex; gap: 10px; align-items: center; margin-bottom: 26px; }

    .input {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 16px;
      padding: 11px 15px;
      transition: border-color .2s, box-shadow .2s;
      -webkit-appearance: none;
      appearance: none;
    }
    .input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-glow); }
    .input-num  { width: 86px; }
    .input-full { width: 100%; }

    .btn {
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: all .17s;
      white-space: nowrap;
    }

    .btn-ghost {
      background: var(--border-dim);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 11px 16px;
      font-size: 0.84rem;
    }
    .btn-ghost:hover { background: var(--border); color: var(--text); }

    .btn-start {
      background: linear-gradient(135deg, var(--gold), #c47d00);
      color: #000;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: .01em;
      width: 100%;
      padding: 15px;
      margin-top: 6px;
      box-shadow: 0 4px 24px rgba(240,165,0,.28);
    }
    .btn-start:hover { opacity: .88; transform: translateY(-1px); box-shadow: 0 8px 32px rgba(240,165,0,.38); }
    .btn-start:active { transform: translateY(0); }
    .btn-start.doubles-mode {
      background: linear-gradient(135deg, var(--doubles), #3a7ad4);
      box-shadow: 0 4px 24px rgba(108,170,255,.28);
    }

    .names-scroll {
      max-height: 360px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 24px;
      padding-right: 2px;
    }
    .names-scroll::-webkit-scrollbar { width: 3px; }
    .names-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* シングルス行 */
    .name-row { display: flex; align-items: center; gap: 10px; }
    .name-row .input { flex: 1; margin: 0; }
    .name-idx {
      font-size: 0.7rem; font-weight: 700;
      color: var(--subtle); width: 18px; text-align: right; flex-shrink: 0;
    }

    /* ダブルス行 */
    .doubles-inputs {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .doubles-inputs .input {
      width: 100%;
      padding: 9px 13px;
      font-size: 15px;
    }
    .doubles-sep {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: .1em;
      color: var(--doubles);
      opacity: .6;
      text-align: center;
      flex-shrink: 0;
      width: 18px;
    }
    /* ダブルスチームの区切り線 */
    .name-row.is-doubles {
      background: rgba(108,170,255,.03);
      border: 1px solid rgba(108,170,255,.08);
      border-radius: 10px;
      padding: 8px 10px;
    }

    /* ━━━━ TOURNAMENT ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    #tournament {
      display: none;
      flex-direction: column;
      /* ✅ スクロール修正: 100dvh で高さを固定し overflow:hidden で外側スクロールを防ぐ */
      height: 100dvh;
      height: 100vh; /* dvh 非対応ブラウザ用フォールバック */
      overflow: hidden;
    }

    .nav {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 28px;
      background: rgba(8,8,12,.97);
      border-bottom: 1px solid var(--border-dim);
      position: sticky; top: 0; z-index: 30;
      flex-shrink: 0; /* navが縮まないように */
    }
    @supports (backdrop-filter: blur(1px)) {
      .nav { background: rgba(8,8,12,.85); backdrop-filter: blur(16px); }
    }
    .nav-title { font-size: 0.9rem; font-weight: 700; color: var(--muted); flex: 1; }
    .nav-title b { color: var(--gold); font-weight: 800; }
    .nav-title b.doubles { color: var(--doubles); }

    .bracket-wrap {
      flex: 1;
      /* ✅ スクロール修正: min-height:0 が必須（flex子要素をコンテンツ以下に縮小可能にする） */
      min-height: 0;
      overflow: auto;
      padding: 44px 40px;
      /* ✅ タブレット横向き: 両軸のタッチスクロールを明示 */
      touch-action: pan-x pan-y;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    #bracket-container { position: relative; display: inline-block; }

    /* Match cards */
    .match-card {
      position: absolute;
      width: 182px;
      background: var(--bg-card);
      border: 1px solid var(--border-dim);
      border-radius: 11px;
      overflow: hidden;
      transition: border-color .25s, box-shadow .25s;
    }
    /* ダブルス用: カードを広げる */
    .match-card.doubles-card { width: 210px; }

    .match-card.active {
      border-color: rgba(240,165,0,.6);
      box-shadow: 0 0 0 1px rgba(240,165,0,.15), 0 0 18px rgba(240,165,0,.12);
      animation: cardPulse 2s ease-in-out infinite;
    }
    .match-card.done { border-color: var(--border-dim); }

    @keyframes cardPulse {
      0%, 100% { box-shadow: 0 0 0 1px rgba(240,165,0,.15), 0 0 18px rgba(240,165,0,.1); }
      50%       { box-shadow: 0 0 0 1px rgba(240,165,0,.3),  0 0 28px rgba(240,165,0,.2); }
    }

    .p-slot {
      display: flex; align-items: center;
      padding: 10px 14px; min-height: 43px;
      font-size: 0.87rem; gap: 9px;
      user-select: none; cursor: default;
      position: relative;
      transition: background .15s;
    }
    /* ダブルスはペアを2行表示するため高さ確保 */
    .p-slot.doubles-slot { min-height: 58px; align-items: flex-start; padding: 8px 12px; }
    .p-slot + .p-slot { border-top: 1px solid var(--border-dim); }

    .p-slot.clickable { cursor: pointer; touch-action: manipulation; }
    .p-slot.clickable .p-name { color: #d4d4e0; }
    .p-slot.clickable:hover,
    .p-slot.clickable:active { background: rgba(240,165,0,.08); }
    .p-slot.clickable:hover .p-name,
    .p-slot.clickable:active .p-name { color: var(--gold-soft); }
    .p-slot.clickable::after {
      content: '▶';
      font-size: 0.55rem;
      color: rgba(240,165,0,.4);
      flex-shrink: 0;
      transition: color .15s, transform .15s;
      margin-top: 4px;
    }
    .p-slot.clickable:hover::after,
    .p-slot.clickable:active::after { color: var(--gold); transform: translateX(2px); }

    .p-slot.winner {
      background: linear-gradient(90deg, rgba(240,165,0,.13), transparent);
    }
    .p-slot.winner .p-name { color: var(--gold-soft); font-weight: 700; }
    .p-slot.winner .p-idx  { color: rgba(240,165,0,.4); }

    .p-slot.loser .p-name  { color: #28282f; }
    .p-slot.loser .p-idx   { color: #1c1c22; }
    .p-slot.empty .p-name  { color: var(--subtle); }

    .p-idx  { font-size: 0.65rem; font-weight: 700; color: var(--subtle); width: 14px; text-align: right; flex-shrink: 0; }
    .p-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #9898a8; }
    .p-crown{ font-size: 0.72rem; flex-shrink: 0; opacity: .8; }

    /* ダブルスのペア名2行 */
    .p-pair {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
      min-width: 0;
    }
    .p-pair-a {
      font-size: 0.83rem;
      font-weight: 600;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: #9898a8;
    }
    .p-pair-b {
      font-size: 0.76rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: #5a5a6e;
    }
    .p-slot.winner .p-pair-a { color: var(--gold-soft); }
    .p-slot.winner .p-pair-b { color: rgba(240,165,0,.55); }
    .p-slot.loser  .p-pair-a { color: #28282f; }
    .p-slot.loser  .p-pair-b { color: #1c1c22; }
    .p-slot.empty  .p-pair-a { color: var(--subtle); }

    .round-lbl {
      position: absolute;
      font-size: 0.62rem; font-weight: 700;
      letter-spacing: .15em; text-transform: uppercase;
      color: var(--subtle); text-align: center;
      transition: color .3s;
    }
    .round-lbl.current { color: rgba(240,165,0,.6); }

    /* ━━━━ WINNER ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    #winner-wrap {
      display: none;
      padding: 40px 20px 60px;
      flex-shrink: 0;
    }

    .winner-box {
      max-width: 420px;
      margin: 0 auto;
      background: var(--bg-card);
      border: 1px solid #2c220a;
      border-radius: 24px;
      padding: 52px 40px 44px;
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: riseIn .5s cubic-bezier(.22,1,.36,1) both;
    }

    .winner-box::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% -10%, rgba(240,165,0,.22) 0%, transparent 60%);
      pointer-events: none;
    }

    .winner-box::after {
      content: '';
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 60%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(28px) scale(.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .w-trophy {
      font-size: 3.8rem;
      display: block;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 30px rgba(240,165,0,.7));
      animation: floatIcon 3s ease-in-out infinite;
    }

    .w-eyebrow {
      font-size: 0.65rem; font-weight: 700;
      letter-spacing: .22em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 10px;
    }

    .w-name {
      font-size: 2.2rem; font-weight: 900;
      letter-spacing: -.04em; color: var(--text);
      line-height: 1.15;
    }
    /* ダブルス優勝: ペア名を2行に分けて表示 */
    .w-name.doubles-winner {
      font-size: 1.8rem;
    }
    .w-pair-a { display: block; color: var(--text); }
    .w-pair-b { display: block; color: var(--gold-soft); font-size: .85em; margin-top: 4px; }

    .w-sub { color: var(--muted); font-size: 0.82rem; margin-top: 10px; }

    .btn-restart {
      display: inline-block; margin-top: 32px;
      background: transparent; border: 1px solid var(--border);
      color: var(--muted); padding: 11px 28px;
      border-radius: 10px; font-family: inherit;
      font-weight: 600; font-size: 0.84rem; cursor: pointer;
      transition: all .18s;
    }
    .btn-restart:hover { border-color: var(--gold); color: var(--gold); }

    /* ━━━━ RESPONSIVE ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .btn, .btn-restart, .btn-start {
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    .btn-start:active { opacity: .85; transform: none; }
    .btn-ghost:active  { background: var(--border); color: var(--text); }
    .btn-restart:active { border-color: var(--gold); color: var(--gold); }

    /* タブレット (601px〜1024px) */
    @media (min-width: 601px) and (max-width: 1024px) {
      .setup-panel { max-width: 560px; }
      .bracket-wrap { padding: 32px 24px; }
      .nav { padding: 14px 20px; }
    }

    /* タブレット横向き: 高さが足りないときも bracket-wrap がスクロールできるように */
    @media (max-height: 600px) and (orientation: landscape) {
      #setup { justify-content: flex-start; padding-top: 32px; }
      .hero  { margin-bottom: 28px; }
      .hero-title { font-size: 2.4rem; }
      .bracket-wrap { padding: 24px 20px; }
    }

    /* スマホ (〜600px) */
    @media (max-width: 600px) {
      .hero-title { font-size: 2.2rem; }
      .setup-panel { padding: 24px 20px; }
      .bracket-wrap { padding: 20px 12px; }
      .nav { padding: 12px 16px; }
      .w-name { font-size: 1.8rem; }
      .winner-box { padding: 36px 24px 32px; }
      .btn-start { font-size: 0.9rem; padding: 13px; }
    }

    /* ダブルスモード: 名前入力が増えるので最大高さ拡張 */
    .doubles-mode-scroll { max-height: 440px; }

    /* Bye auto-advance label */
    .bye-auto {
      position: absolute;
      width: 182px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 14px;
      pointer-events: none;
    }
    .bye-auto.doubles-card { width: 210px; }
    .bye-auto-name {
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: #38384a; font-size: 0.78rem;
    }
    .bye-auto-tag {
      font-size: 0.5rem; color: #252530;
      letter-spacing: .04em; flex-shrink: 0;
    }

    /* Bracket lines via canvas */
    #lines-canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
  </style>
</head>
<body>

<!-- ── SETUP ─────────────────────────────────── -->
<div id="setup">
  <div class="hero">
    <span class="hero-icon">🏆</span>
    <h1 class="hero-title">TOURNAMENT</h1>
    <p class="hero-sub" id="hero-sub">Single Elimination</p>
  </div>

  <div class="setup-panel">
    <!-- モード切替 -->
    <div class="mode-toggle">
      <button class="mode-btn active" id="btn-singles" onclick="setMode(false)">🎾 シングルス</button>
      <button class="mode-btn" id="btn-doubles" onclick="setMode(true)">👥 ダブルス</button>
    </div>

    <label class="lbl" id="lbl-count">参加者数</label>
    <div class="field-row">
      <input type="number" id="num-p" class="input input-num" min="2" max="32" value="8">
      <button class="btn btn-ghost" onclick="updateInputs()">更新</button>
    </div>

    <label class="lbl" id="lbl-names">参加者名</label>
    <div class="names-scroll" id="names-list"></div>

    <button class="btn btn-start" id="btn-start" onclick="startTournament()">トーナメント開始 →</button>
  </div>
</div>

<!-- ── TOURNAMENT ─────────────────────────────── -->
<div id="tournament">
  <div class="nav">
    <span class="nav-title">🏆 <b id="nav-mode-label">TOURNAMENT</b></span>
    <button class="btn btn-ghost" style="padding:8px 14px;font-size:.8rem;" onclick="backToSetup()">← やり直す</button>
  </div>
  <div class="bracket-wrap">
    <div id="bracket-container">
      <canvas id="lines-canvas"></canvas>
    </div>
  </div>
  <div id="winner-wrap">
    <div class="winner-box">
      <span class="w-trophy">🏆</span>
      <p class="w-eyebrow">Champion</p>
      <p class="w-name" id="w-name"></p>
      <p class="w-sub">おめでとうございます！</p>
      <button class="btn-restart" onclick="backToSetup()">もう一度プレイ</button>
    </div>
  </div>
</div>

<script>
// ── Constants ─────────────────────────────────────────────
const BYE = { name: '—', isBye: true };

const MATCH_W_SINGLES = 182;
const MATCH_W_DOUBLES = 214;
const ROUND_GAP = 56;
const LABEL_H   = 26;

// ── State ─────────────────────────────────────────────────
let T         = null;
let isDoubles = false;

// ── Mode ──────────────────────────────────────────────────
function setMode(doubles) {
  isDoubles = doubles;

  // ボタン見た目
  document.getElementById('btn-singles').classList.toggle('active', !doubles);
  document.getElementById('btn-doubles').classList.toggle('active',  doubles);
  document.getElementById('btn-doubles').classList.toggle('doubles-active', doubles);

  // ラベル/ヒーロー更新
  document.getElementById('hero-sub').textContent  = doubles ? 'Doubles Elimination' : 'Single Elimination';
  document.getElementById('hero-sub').classList.toggle('is-doubles', doubles);
  document.getElementById('lbl-count').textContent = doubles ? 'ペア数' : '参加者数';
  document.getElementById('lbl-names').textContent = doubles ? 'ペア名（選手A / 選手B）' : '参加者名';
  document.getElementById('btn-start').classList.toggle('doubles-mode', doubles);
  document.getElementById('btn-start').textContent = doubles
    ? 'ダブルストーナメント開始 →'
    : 'トーナメント開始 →';

  updateInputs();
}

// ── Setup ─────────────────────────────────────────────────
function layoutParams(N0) {
  const MATCH_W = isDoubles ? MATCH_W_DOUBLES : MATCH_W_SINGLES;
  const slotH   = Math.max(isDoubles ? 28 : 22, Math.min(isDoubles ? 48 : 40, Math.floor(360 / N0)));
  const matchH  = slotH * 2 + 2;
  const gap     = Math.max(6, Math.min(14, Math.floor(80 / N0)));
  return { slotH, matchH, gap, unit: matchH + gap, MATCH_W };
}

function updateInputs() {
  const n = Math.max(2, Math.min(32, +document.getElementById('num-p').value || 8));
  document.getElementById('num-p').value = n;

  const list = document.getElementById('names-list');
  list.classList.toggle('doubles-mode-scroll', isDoubles);

  // 既存の値を保持
  const prevA = [...list.querySelectorAll('.inp-a')].map(i => i.value);
  const prevB = [...list.querySelectorAll('.inp-b')].map(i => i.value);
  const prevS = [...list.querySelectorAll('.inp-s')].map(i => i.value);
  list.innerHTML = '';

  for (let i = 0; i < n; i++) {
    const row = document.createElement('div');
    if (isDoubles) {
      row.className = 'name-row is-doubles';
      row.innerHTML = `
        <span class="name-idx" style="margin-top:6px">${i+1}</span>
        <div class="doubles-inputs">
          <input type="text" class="input inp-a" placeholder="選手A（${i+1}ペア）" value="${h(prevA[i]||'')}">
          <input type="text" class="input inp-b" placeholder="選手B（${i+1}ペア）" value="${h(prevB[i]||'')}">
        </div>`;
    } else {
      row.className = 'name-row';
      row.innerHTML = `
        <span class="name-idx">${i+1}</span>
        <input type="text" class="input inp-s" placeholder="参加者 ${i+1}" value="${h(prevS[i]||'')}">`;
    }
    list.appendChild(row);
  }
}

function startTournament() {
  let players;

  if (isDoubles) {
    const aInputs = [...document.querySelectorAll('#names-list .inp-a')];
    const bInputs = [...document.querySelectorAll('#names-list .inp-b')];
    players = aInputs.map((el, i) => {
      const a = el.value.trim() || `選手A ${i+1}`;
      const b = bInputs[i].value.trim() || `選手B ${i+1}`;
      return { name: `${a} / ${b}`, pairA: a, pairB: b, id: i, isTeam: true };
    });
  } else {
    const inputs = [...document.querySelectorAll('#names-list .inp-s')];
    players = inputs.map((el, i) => ({ name: el.value.trim() || `参加者 ${i+1}`, id: i }));
  }

  shuffle(players);
  initTournament(players);

  // ナビラベル
  document.getElementById('nav-mode-label').textContent = isDoubles ? 'DOUBLES' : 'TOURNAMENT';
  document.getElementById('nav-mode-label').classList.toggle('doubles', isDoubles);

  document.getElementById('setup').style.display      = 'none';
  document.getElementById('winner-wrap').style.display = 'none';
  document.getElementById('tournament').style.display  = 'flex';
  render();
}

function backToSetup() {
  document.getElementById('tournament').style.display = 'none';
  document.getElementById('setup').style.display = 'flex';
}

// ── Tournament logic ──────────────────────────────────────
function initTournament(players) {
  let size = 1;
  while (size < players.length) size <<= 1;
  const numByes = size - players.length;

  const slots = [];
  for (let i = 0; i < numByes; i++) slots.push(players[i], BYE);
  for (let i = numByes; i < players.length; i++) slots.push(players[i]);

  const rounds = [];
  let cur = slots;
  while (cur.length >= 2) {
    const rd = [];
    for (let i = 0; i < cur.length; i += 2)
      rd.push({ p1: cur[i], p2: cur[i+1], winner: null });
    rounds.push(rd);
    cur = new Array(cur.length >> 1).fill(null);
  }
  T = { rounds };
  autoByes();
}

function autoByes() {
  let changed = true;
  while (changed) {
    changed = false;
    T.rounds.forEach((rd, ri) => {
      rd.forEach((m, mi) => {
        if (m.winner !== null) return;
        const b1 = m.p1 === BYE;
        const b2 = m.p2 === BYE;
        const r1 = m.p1 && !m.p1.isBye;
        const r2 = m.p2 && !m.p2.isBye;
        if (b1 && b2)      { adv(ri, mi, BYE);   changed = true; }
        else if (b1 && r2) { adv(ri, mi, m.p2); changed = true; }
        else if (r1 && b2) { adv(ri, mi, m.p1); changed = true; }
      });
    });
  }
}

function adv(ri, mi, player) {
  T.rounds[ri][mi].winner = player;
  if (ri + 1 < T.rounds.length) {
    const nm = T.rounds[ri+1][mi>>1];
    if (mi % 2 === 0) nm.p1 = player; else nm.p2 = player;
  }
}

function pick(ri, mi, player) {
  const m = T.rounds[ri][mi];
  if (m.winner || !player || player.isBye) return;
  adv(ri, mi, player);
  autoByes();
  render();
  checkWinner();
}

function checkWinner() {
  const last = T.rounds[T.rounds.length - 1][0];
  if (last.winner && !last.winner.isBye) {
    const wName  = document.getElementById('w-name');
    if (last.winner.isTeam) {
      wName.className = 'w-name doubles-winner';
      wName.innerHTML = `<span class="w-pair-a">🤝 ${h(last.winner.pairA)}</span><span class="w-pair-b">${h(last.winner.pairB)}</span>`;
    } else {
      wName.className = 'w-name';
      wName.textContent = last.winner.name;
    }
    document.getElementById('winner-wrap').style.display = 'block';
  }
}

// ── Rendering ─────────────────────────────────────────────
function rdLabel(ri, total) {
  const e = total - 1 - ri;
  if (e === 0) return '決勝';
  if (e === 1) return '準決勝';
  if (e === 2) return '準々決勝';
  return `ROUND ${ri + 1}`;
}

function cy(ri, mi, unit, gap) {
  const g = 1 << ri;
  const t = mi * g * unit + LABEL_H;
  const b = t + g * unit - gap;
  return (t + b) / 2;
}

function render() {
  const cont = document.getElementById('bracket-container');
  cont.querySelectorAll('.match-card,.round-lbl,.bye-auto').forEach(e => e.remove());

  const R  = T.rounds.length;
  const N0 = T.rounds[0].length;
  const { matchH, gap, unit, MATCH_W } = layoutParams(N0);

  const totalH = N0 * unit - gap + LABEL_H;
  const totalW = R * (MATCH_W + ROUND_GAP) - ROUND_GAP;

  cont.style.height = totalH + 'px';
  cont.style.width  = totalW + 'px';

  const cv  = document.getElementById('lines-canvas');
  const dpr = window.devicePixelRatio || 1;
  cv.width  = totalW * dpr;
  cv.height = totalH * dpr;
  cv.style.width  = totalW + 'px';
  cv.style.height = totalH + 'px';
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, totalW, totalH);

  const activeRound = T.rounds.findIndex(rd =>
    rd.some(m => !m.winner && m.p1 && !m.p1.isBye && m.p2 && !m.p2.isBye)
  );

  T.rounds.forEach((rd, ri) => {
    const x = ri * (MATCH_W + ROUND_GAP);

    const lbl = document.createElement('div');
    lbl.className = 'round-lbl' + (ri === activeRound ? ' current' : '');
    lbl.style.cssText = `left:${x}px;top:0;width:${MATCH_W}px;`;
    lbl.textContent = rdLabel(ri, R);
    cont.appendChild(lbl);

    rd.forEach((m, mi) => {
      const centerY = cy(ri, mi, unit, gap);
      const topY    = centerY - matchH / 2;
      const isByeMatch = ri === 0 && (m.p1 === BYE || m.p2 === BYE);

      if (isByeMatch) {
        const winner = m.p1 === BYE ? m.p2 : m.p1;
        if (winner && !winner.isBye) {
          const el = document.createElement('div');
          el.className = 'bye-auto' + (isDoubles ? ' doubles-card' : '');
          el.style.cssText = `left:${x}px;top:${centerY - 14}px;`;
          el.innerHTML = `<span class="bye-auto-name">${h(winner.name)}</span><span class="bye-auto-tag">不戦勝</span>`;
          cont.appendChild(el);
        }
      } else {
        const bothReal = m.p1 && !m.p1.isBye && m.p2 && !m.p2.isBye;
        const card = document.createElement('div');
        card.className = 'match-card' + (isDoubles ? ' doubles-card' : '') + ' ' +
                         (m.winner ? 'done' : bothReal ? 'active' : '');
        card.style.cssText = `left:${x}px;top:${topY}px;`;
        card.appendChild(slot(m.p1, m, ri, mi, matchH));
        card.appendChild(slot(m.p2, m, ri, mi, matchH));
        cont.appendChild(card);
      }

      // コネクターライン
      if (ri < R - 1) {
        const x1   = x + MATCH_W;
        const midX = x1 + ROUND_GAP / 2;
        const nextY = cy(ri + 1, mi >> 1, unit, gap);
        const isAuto    = m.p1 === BYE || m.p2 === BYE;
        const hasRealWin = !!m.winner && !m.winner.isBye;
        const lc = hasRealWin && !isAuto ? 'rgba(240,165,0,.35)' : 'rgba(30,30,46,.95)';

        line(ctx, x1, centerY, midX, centerY, lc);
        if (mi % 2 === 0) {
          const sibY = mi + 1 < rd.length ? cy(ri, mi + 1, unit, gap) : centerY;
          line(ctx, midX, centerY, midX, sibY, lc);
          line(ctx, midX, nextY, x + MATCH_W + ROUND_GAP, nextY, lc);
        }
      }
    });
  });
}

function slot(player, m, ri, mi, matchH) {
  const el = document.createElement('div');
  const slotH = Math.floor((matchH - 2) / 2);

  const real     = player && !player.isBye;
  const bothReal = m.p1 && !m.p1.isBye && m.p2 && !m.p2.isBye;

  if (isDoubles && real) {
    // ダブルス: ペアを2行表示
    el.className = 'p-slot doubles-slot';
    el.style.minHeight = slotH + 'px';

    const isWinner = m.winner === player;
    const isLoser  = m.winner && m.winner !== player;

    if (isWinner) el.classList.add('winner');
    else if (isLoser) el.classList.add('loser');
    else if (bothReal) {
      el.classList.add('clickable');
      el.title = `${player.name} を勝者に選択`;
      el.addEventListener('click', () => pick(ri, mi, player));
    }

    const crown = isWinner ? '<span class="p-crown">★</span>' : '';
    el.innerHTML = `
      <div class="p-pair">
        <span class="p-pair-a">${h(player.pairA || player.name)}</span>
        <span class="p-pair-b">${player.pairB ? h(player.pairB) : ''}</span>
      </div>${crown}`;
  } else {
    // シングルス（従来通り）
    el.className = 'p-slot';
    el.style.minHeight = slotH + 'px';
    el.style.fontSize  = slotH < 28 ? '0.75rem' : '0.87rem';

    if (!real) {
      el.classList.add('empty');
      el.innerHTML = '<span class="p-name">—</span>';
    } else if (m.winner === player) {
      el.classList.add('winner');
      el.innerHTML = `<span class="p-name">${h(player.name)}</span><span class="p-crown">★</span>`;
    } else if (m.winner) {
      el.classList.add('loser');
      el.innerHTML = `<span class="p-name">${h(player.name)}</span>`;
    } else {
      if (bothReal) {
        el.classList.add('clickable');
        el.title = `${player.name} を勝者に選択`;
        el.addEventListener('click', () => pick(ri, mi, player));
      }
      el.innerHTML = `<span class="p-name">${h(player.name)}</span>`;
    }
  }
  return el;
}

function line(ctx, x1, y1, x2, y2, color) {
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

// ── Util ──────────────────────────────────────────────────
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
}

function h(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Init
updateInputs();

// Service Worker 登録（PWA）
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
