<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TOURNAMENT</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f0a500">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tournament">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    * { -webkit-tap-highlight-color: transparent; }

    :root {
      --bg:         #08080c;
      --bg-card:    #0e0e14;
      --bg-input:   #0a0a0f;
      --border:     #222230;
      --border-dim: #16161f;
      --gold:       #f0a500;
      --gold-soft:  #fbbf24;
      --gold-glow:  rgba(240,165,0,.18);
      --text:       #f4f4f6;
      --muted:      #6b6b80;
      --subtle:     #2e2e3a;
      --doubles:    #6caaff;
      --loss:       #ff7b72;
      --loss-glow:  rgba(255,123,114,.18);
    }

    body {
      font-family: 'Inter','Meiryo',sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ━━━━ SETUP ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    #setup {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 48px 20px;
    }
    .hero { text-align: center; margin-bottom: 44px; }
    .hero-icon {
      display: inline-block; font-size: 2.8rem; margin-bottom: 18px;
      filter: drop-shadow(0 0 28px rgba(240,165,0,.55));
      animation: floatIcon 3s ease-in-out infinite;
    }
    @keyframes floatIcon {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    .hero-title {
      font-size: 3.4rem; font-weight: 900;
      letter-spacing: -.05em; line-height: 1;
      background: linear-gradient(160deg,#fff 30%,#6b6b80);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .hero-sub {
      margin-top: 10px; font-size: 0.72rem; font-weight: 600;
      letter-spacing: .22em; text-transform: uppercase; color: var(--muted);
      transition: color .3s;
    }
    .hero-sub.is-doubles { color: var(--doubles); }

    .setup-panel {
      width: 100%; max-width: 480px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 20px; padding: 32px 28px;
      box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.03) inset;
    }
    .setup-main { display: block; }
    .setup-controls, .setup-roster { min-width: 0; }

    /* モード切替 */
    .mode-toggle { display: flex; gap: 0; background: var(--bg-input); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin-bottom: 24px; }
    .mode-btn {
      flex: 1; border: none; border-radius: 9px; font-family: inherit;
      font-size: 0.82rem; font-weight: 700; letter-spacing: .04em;
      padding: 10px 8px; cursor: pointer; transition: all .2s;
      background: transparent; color: var(--muted); touch-action: manipulation;
    }
    .mode-btn.active { background: linear-gradient(135deg,var(--gold),#c47d00); color: #000; box-shadow: 0 2px 12px rgba(240,165,0,.3); }
    .mode-btn.active.d { background: linear-gradient(135deg,var(--doubles),#3a7ad4); color: #fff; box-shadow: 0 2px 12px rgba(108,170,255,.3); }

    .lbl { display: block; font-size: 0.68rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
    .field-row { display: flex; gap: 10px; align-items: center; margin-bottom: 22px; }

    .input {
      background: var(--bg-input); border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); font-family: inherit; font-size: 16px;
      padding: 11px 15px; transition: border-color .2s,box-shadow .2s;
      -webkit-appearance: none; appearance: none;
    }
    .input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-glow); }
    .input-num  { width: 86px; }
    .input-full { width: 100%; }

    .btn { border: none; border-radius: 10px; font-family: inherit; font-weight: 600; cursor: pointer; transition: all .17s; white-space: nowrap; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
    .btn-ghost { background: var(--border-dim); border: 1px solid var(--border); color: var(--muted); padding: 11px 16px; font-size: 0.84rem; }
    .btn-ghost:hover { background: var(--border); color: var(--text); }
    .btn-ghost:active { background: var(--border); color: var(--text); }
    .btn-count-sync { color: #77778c; }

    .btn-start {
      background: linear-gradient(135deg,var(--gold),#c47d00); color: #000;
      font-weight: 800; font-size: 0.95rem; letter-spacing: .01em;
      width: 100%; padding: 15px; margin-top: 8px;
      box-shadow: 0 4px 24px rgba(240,165,0,.28);
    }
    .btn-start:hover { opacity: .88; transform: translateY(-1px); }
    .btn-start:active { opacity: .85; transform: none; }
    .btn-start.d { background: linear-gradient(135deg,var(--doubles),#3a7ad4); color: #fff; box-shadow: 0 4px 24px rgba(108,170,255,.28); }

    /* 名前リスト */
    .names-scroll { max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 7px; margin-bottom: 18px; padding-right: 2px; }
    .names-scroll::-webkit-scrollbar { width: 3px; }
    .names-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .name-row { display: flex; align-items: center; gap: 10px; }
    .name-row .input { flex: 1; margin: 0; }
    .name-idx { font-size: 0.7rem; font-weight: 700; color: var(--subtle); width: 18px; text-align: right; flex-shrink: 0; }

    /* 奇数 不戦勝セレクター */
    .bye-section {
      display: none; margin-bottom: 18px;
      background: rgba(240,165,0,.06); border: 1px solid rgba(240,165,0,.2);
      border-radius: 12px; padding: 14px 16px;
    }
    .bye-section .lbl { color: var(--gold); margin-bottom: 10px; font-size: 0.78rem; font-weight: 700; letter-spacing: .06em; }
    /* ランダム／指定 トグル */
    .bye-mode-toggle { display: flex; gap: 6px; margin-bottom: 12px; }
    .bye-mode-btn {
      flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); font-family: inherit;
      font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all .15s;
      touch-action: manipulation;
    }
    .bye-mode-btn.active { background: rgba(240,165,0,.18); border-color: rgba(240,165,0,.5); color: var(--gold); }
    .bye-select {
      background: var(--bg-input); border: 1px solid rgba(240,165,0,.25);
      border-radius: 10px; color: var(--text); font-family: inherit;
      font-size: 15px; padding: 10px 14px; width: 100%;
      -webkit-appearance: none; appearance: none; cursor: pointer;
    }
    .bye-select:focus { outline: none; border-color: var(--gold); }
    .bye-random-note { font-size: 0.8rem; color: var(--muted); padding: 4px 2px; }

    /* ランダムペアボタン */
    .btn-randomize {
      display: none; width: 100%; padding: 12px; margin-bottom: 14px;
      background: rgba(108,170,255,.1); border: 1px dashed rgba(108,170,255,.35);
      color: var(--doubles); font-family: inherit; font-size: 0.88rem; font-weight: 700;
      border-radius: 10px; cursor: pointer; transition: all .18s; touch-action: manipulation;
    }
    .btn-randomize:hover  { background: rgba(108,170,255,.18); border-style: solid; }
    .btn-randomize:active { background: rgba(108,170,255,.24); }

    /* ペアプレビュー */
    .pairs-preview { display: none; flex-direction: column; gap: 6px; margin-bottom: 16px; background: rgba(108,170,255,.05); border: 1px solid rgba(108,170,255,.12); border-radius: 12px; padding: 12px 12px 8px; max-height: 260px; overflow-y: auto; }
    .pairs-preview::-webkit-scrollbar { width: 3px; }
    .pairs-preview::-webkit-scrollbar-thumb { background: rgba(108,170,255,.3); border-radius: 2px; }
    .pairs-preview-hdr { font-size: 0.62rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--doubles); opacity: .7; margin-bottom: 6px; }
    .pair-row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; background: rgba(108,170,255,.06); border-radius: 8px; border: 1px solid rgba(108,170,255,.1); }
    .pair-num { font-size: 0.65rem; font-weight: 700; color: rgba(108,170,255,.5); width: 16px; text-align: right; flex-shrink: 0; }
    .pair-names { flex: 1; font-size: 0.84rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .pair-slash { color: rgba(108,170,255,.5); margin: 0 5px; font-weight: 300; }

    /* ━━━━ TOURNAMENT ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    #tournament {
      display: none; flex-direction: column;
      height: 100dvh; height: 100vh;
      overflow: hidden;
    }
    .nav {
      position: sticky; top: 0;
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px;
      background: rgba(8,8,12,.97); border-bottom: 1px solid var(--border-dim);
      flex-shrink: 0; z-index: 50;
    }
    @supports (backdrop-filter:blur(1px)) { .nav { background: rgba(8,8,12,.85); backdrop-filter: blur(16px); } }
    .nav-brand { font-size: 0.88rem; font-weight: 700; color: var(--muted); flex: 1; min-width: 0; }
    .nav-brand b { color: var(--gold); }
    .nav-brand b.d { color: var(--doubles); }
    .btn-back { padding: 7px 12px; font-size: .78rem; flex-shrink: 0; white-space: nowrap; }
    .save-status {
      flex-shrink: 0; display: inline-flex; align-items: center; gap: 5px;
      min-height: 28px; padding: 0 10px; border-radius: 999px;
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
      color: var(--muted); font-size: 0.68rem; font-weight: 700; letter-spacing: .04em;
    }
    .save-status::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: #3f3f52; box-shadow: 0 0 0 3px rgba(255,255,255,.03);
    }
    .save-status.saved { color: rgba(126,231,135,.86); border-color: rgba(126,231,135,.18); background: rgba(126,231,135,.06); }
    .save-status.saved::before { background: #7ee787; box-shadow: 0 0 0 3px rgba(126,231,135,.12); }
    .save-status.restored { color: rgba(160,192,255,.9); border-color: rgba(160,192,255,.2); background: rgba(160,192,255,.07); }
    .save-status.restored::before { background: #a0c0ff; box-shadow: 0 0 0 3px rgba(160,192,255,.12); }
    .save-status.error { color: #ff8888; border-color: rgba(255,120,120,.24); background: rgba(255,80,80,.08); }
    .save-status.error::before { background: #ff8888; box-shadow: 0 0 0 3px rgba(255,80,80,.12); }

    /* タブ */
    .tab-group { display: flex; gap: 4px; flex-shrink: 0; }
    .tab-btn {
      padding: 7px 14px; border: none; border-radius: 8px;
      font-family: inherit; font-size: 0.78rem; font-weight: 700;
      cursor: pointer; transition: all .18s; touch-action: manipulation;
      background: var(--border-dim); color: var(--muted); white-space: nowrap;
    }
    .tab-btn.active-w { background: rgba(240,165,0,.2); color: var(--gold); }
    .tab-btn.active-l { background: rgba(255,123,114,.2); color: var(--loss); }
    .tab-btn.active-h { background: rgba(120,120,200,.2); color: #a0a0e0; }
    .tab-btn .tab-badge {
      display: inline-block; margin-left: 4px;
      font-size: 0.6rem; background: rgba(255,255,255,.1);
      border-radius: 20px; padding: 1px 6px;
    }

    /* ハンバーガーボタン（デフォルト非表示） */
    .btn-hamburger {
      display: none;
      background: none; border: 1px solid var(--border-dim);
      border-radius: 8px; color: var(--muted);
      font-size: 1.2rem; line-height: 1;
      padding: 6px 10px; cursor: pointer;
      touch-action: manipulation; flex-shrink: 0;
      transition: background .15s;
    }
    .btn-hamburger:active { background: rgba(255,255,255,.08); }

    /* ハンバーガードロップダウン */
    .hamburger-menu {
      display: none; flex-direction: column; gap: 4px;
      position: fixed; right: 10px;
      z-index: 200; min-width: 230px;
      background: rgba(14,14,20,.98);
      border: 1px solid var(--border);
      border-radius: 14px; padding: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,.7);
    }
    .hamburger-menu.open { display: flex; animation: menuDrop .18s ease; }
    @keyframes menuDrop {
      from { opacity:0; transform:translateY(-6px) scale(.97); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }
    .hmenu-item {
      display: flex; align-items: center; gap: 10px;
      padding: 13px 14px; border: none; border-radius: 10px;
      background: none; color: var(--text); width: 100%;
      font-family: inherit; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; text-align: left; touch-action: manipulation;
      transition: background .15s;
    }
    .hmenu-item:active { background: rgba(255,255,255,.07); }
    .hmenu-item.hmenu-w { background: rgba(240,165,0,.15); color: var(--gold); }
    .hmenu-item.hmenu-l { background: rgba(255,123,114,.15); color: var(--loss); }
    .hmenu-item.hmenu-h { background: rgba(120,120,200,.15); color: #a0a0e0; }
    .hmenu-icon { font-size: 1.1rem; }
    .hmenu-name { flex: 1; }
    .hmenu-badge {
      font-size: 0.62rem; font-weight: 700;
      background: rgba(255,255,255,.1); border-radius: 20px;
      padding: 2px 7px; color: var(--muted);
    }
    /* バックドロップ */
    .hamburger-backdrop {
      display: none; position: fixed; inset: 0; z-index: 199;
    }
    .hamburger-backdrop.open { display: block; }

    .bracket-wrap {
      flex: 1; min-height: 0;
      overflow: auto; padding: 40px 36px;
      touch-action: pan-x pan-y;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    .bracket-area { display: none; }
    .bracket-area.visible { display: block; }
    #bracket-w, #bracket-l { position: relative; display: inline-block; }

    /* Match cards */
    .match-card {
      position: absolute; width: 200px;
      background: var(--bg-card); border: 1px solid var(--border-dim);
      border-radius: 11px; overflow: hidden;
      transition: border-color .25s, box-shadow .25s;
    }
    .match-card.doubles-card { width: 220px; }
    .match-card.active-w {
      background: linear-gradient(180deg,rgba(240,165,0,.08),rgba(14,14,20,.98) 42%);
      border-color: rgba(240,165,0,.86);
      box-shadow: 0 0 0 2px rgba(240,165,0,.18), 0 0 26px rgba(240,165,0,.18);
      animation: pulseW 2s ease-in-out infinite;
    }
    .match-card.active-l {
      background: linear-gradient(180deg,rgba(255,123,114,.08),rgba(14,14,20,.98) 42%);
      border-color: rgba(255,123,114,.86);
      box-shadow: 0 0 0 2px rgba(255,123,114,.18), 0 0 26px rgba(255,123,114,.18);
      animation: pulseL 2s ease-in-out infinite;
    }
    .match-card.done { border-color: var(--border-dim); }
    @keyframes pulseW {
      0%,100% { box-shadow: 0 0 0 2px rgba(240,165,0,.18), 0 0 26px rgba(240,165,0,.18); }
      50%      { box-shadow: 0 0 0 2px rgba(240,165,0,.32), 0 0 36px rgba(240,165,0,.28); }
    }
    @keyframes pulseL {
      0%,100% { box-shadow: 0 0 0 2px rgba(255,123,114,.18), 0 0 26px rgba(255,123,114,.18); }
      50%      { box-shadow: 0 0 0 2px rgba(255,123,114,.32), 0 0 36px rgba(255,123,114,.28); }
    }

    /* スロット */
    .p-slot {
      display: flex; align-items: center;
      padding: 8px 12px; min-height: 42px; gap: 8px;
      font-size: 0.86rem; user-select: none; cursor: default;
      transition: background .15s; position: relative;
    }
    .p-slot + .p-slot { border-top: 1px solid var(--border-dim); }
    .p-slot.clickable { cursor: pointer; touch-action: manipulation; }
    .p-slot.clickable:hover, .p-slot.clickable:active { background: rgba(240,165,0,.08); }
    .p-slot.clickable:hover .p-name, .p-slot.clickable:active .p-name { color: var(--gold-soft); }
    .p-slot.winner { background: linear-gradient(90deg,rgba(240,165,0,.13),transparent); }
    .p-slot.winner .p-name  { color: var(--gold-soft); font-weight: 800; }
    .p-slot.loser  .p-name  { color: #57576a; }
    .p-slot.empty  .p-name  { color: var(--subtle); }
    /* 敗者ブラケットのスロットはロス色 */
    .p-slot.clickable.loss-bracket:hover, .p-slot.clickable.loss-bracket:active { background: rgba(255,123,114,.08); }
    .p-slot.clickable.loss-bracket:hover .p-name, .p-slot.clickable.loss-bracket:active .p-name { color: var(--loss); }
    .p-slot.winner.loss-bracket { background: linear-gradient(90deg,rgba(255,123,114,.13),transparent); }
    .p-slot.winner.loss-bracket .p-name { color: var(--loss); }

    .p-name  { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #b8b8c8; }
    .p-crown { font-size: 0.7rem; flex-shrink: 0; opacity: .8; }

    /* スコア入力 */
    .score-input {
      width: 54px; min-height: 40px; flex-shrink: 0;
      background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.16);
      border-radius: 8px; color: var(--text); font-family: inherit;
      font-size: 1rem; font-weight: 800; padding: 5px 7px;
      text-align: center; -webkit-appearance: none; appearance: none;
      transition: border-color .15s; cursor: text;
      touch-action: manipulation;
    }
    .score-input:focus { outline: none; border-color: var(--gold); background: rgba(240,165,0,.1); box-shadow: 0 0 0 3px var(--gold-glow); }
    .score-input.score-required { border-color: rgba(240,165,0,.9) !important; box-shadow: 0 0 0 3px rgba(240,165,0,.3) !important; animation: scoreFlash .4s ease 2; }
    @keyframes scoreFlash { 0%,100%{opacity:1} 50%{opacity:.4} }
    .score-input::-webkit-inner-spin-button,
    .score-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .score-input[type=number] { -moz-appearance: textfield; }
    .score-badge { font-size: 0.85rem; font-weight: 700; color: #6a6a8a; flex-shrink: 0; min-width: 26px; text-align: right; }
    .p-slot.winner .score-badge { color: var(--gold-soft); }
    .p-slot.loser  .score-badge { color: #5a5a72; }
    /* 試合カード内スコアまとめ表示 */
    .match-score-bar {
      display: flex; justify-content: center; align-items: center;
      gap: 4px; padding: 2px 10px 4px;
      font-size: 0.72rem; font-weight: 700; letter-spacing: .04em;
      color: #44445a; border-top: 1px solid rgba(255,255,255,.04);
    }
    .match-score-bar.has-score { color: #8888aa; }
    .match-score-bar .msb-w { color: var(--gold-soft); }
    .match-score-bar .msb-l { color: #5a5a72; }

    /* ダブルス ペア表示 */
    .p-pair { flex: 1; display: flex; flex-direction: column; gap: 1px; overflow: hidden; min-width: 0; }
    .p-pair-a { font-size: 0.82rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #9898a8; }
    .p-pair-b { font-size: 0.74rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #5a5a6e; }
    .p-slot.winner .p-pair-a { color: var(--gold-soft); }
    .p-slot.winner .p-pair-b { color: rgba(240,165,0,.5); }
    .p-slot.loser  .p-pair-a, .p-slot.loser .p-pair-b { color: #57576a; }

    .round-lbl {
      position: absolute; font-size: 0.62rem; font-weight: 700;
      letter-spacing: .15em; text-transform: uppercase;
      color: var(--subtle); text-align: center; transition: color .3s;
    }
    .round-lbl.cur-w { color: var(--gold); text-shadow: 0 0 18px rgba(240,165,0,.32); }
    .round-lbl.cur-l { color: var(--loss); text-shadow: 0 0 18px rgba(255,123,114,.32); }

    /* 敗者ブラケット 未準備 */
    .losers-pending {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 300px; gap: 12px; color: var(--muted);
    }
    .losers-pending-icon { font-size: 2.5rem; opacity: .4; }
    .losers-pending p { font-size: 0.84rem; text-align: center; line-height: 1.7; }

    /* ━━━━ WINNER ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    /* オーバーレイ: ブラケットの上に重ねて表示 */
    #winner-wrap {
      display: none;
      position: fixed; inset: 0; z-index: 100;
      background: rgba(8,8,12,.78);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      overflow-y: auto;
      padding: 32px 20px 48px;
      animation: fadeInBg .35s ease both;
    }
    @keyframes fadeInBg {
      from { opacity: 0; } to { opacity: 1; }
    }
    .winner-box {
      max-width: 420px; margin: 60px auto 0;
      background: var(--bg-card); border: 1px solid #2c220a;
      border-radius: 24px; padding: 48px 36px 40px;
      text-align: center; position: relative; overflow: hidden;
      animation: riseIn .5s cubic-bezier(.22,1,.36,1) both;
    }
    .winner-box::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% -10%,rgba(240,165,0,.22) 0%,transparent 60%);
      pointer-events: none;
    }
    .winner-box::after {
      content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 60%; height: 1px;
      background: linear-gradient(90deg,transparent,var(--gold),transparent);
    }
    @keyframes riseIn {

    .w-trophy { font-size: 3.8rem; display: block; margin-bottom: 18px; filter: drop-shadow(0 0 30px rgba(240,165,0,.7)); animation: floatIcon 3s ease-in-out infinite; }

    .w-name { font-size: 2.2rem; font-weight: 900; letter-spacing: -.04em; color: var(--text); line-height: 1.15; }
    .w-name.d { font-size: 1.8rem; }
    .w-pair-a { display: block; }
    .w-pair-b { display: block; color: var(--gold-soft); font-size: .8em; margin-top: 4px; }
    .w-sub { color: var(--muted); font-size: 0.82rem; margin-top: 10px; }
    /* ボタン横並び */
    .winner-btns { display: flex; gap: 12px; justify-content: center; margin-top: 28px; flex-wrap: wrap; }
    .btn-restart, .btn-see-bracket {
      display: inline-block; background: transparent; border: 1px solid var(--border);
      color: var(--muted); padding: 11px 22px; border-radius: 10px;
      font-family: inherit; font-weight: 600; font-size: 0.84rem;
      cursor: pointer; transition: all .18s;
    }
    .btn-restart:hover    { border-color: var(--gold); color: var(--gold); }
    .btn-see-bracket      { border-color: #3a3a4a; color: #9898a8; }
    .btn-see-bracket:hover { border-color: #6a6a8a; color: var(--text); }

    /* 待機中スロット */
    .p-name.tbd { color: #3a3a52; font-style: italic; font-size: 0.78rem; }

    /* 取り消しボタン：2スロット中央に配置、円形デザイン */
    /* ビリ決定戦・3位決定戦ヒントラベル（カード内トップ） */
    .biri-hint {
      display: block; width: 100%; text-align: center; padding: 3px 0;
      font-size: 0.58rem; font-weight: 700; letter-spacing: .06em;
      color: rgba(255,123,114,.6); background: rgba(255,123,114,.06);

    }
    .tp-hint {
      display: block; width: 100%; text-align: center; padding: 3px 0;

      color: rgba(160,192,255,.6); background: rgba(160,192,255,.06);
      pointer-events: none; border-bottom: 1px solid rgba(160,192,255,.1);
    }
    /* 3位決定戦セクション */
    #third-place-section {
      padding: 20px 24px 16px;
      border-top: 1px solid var(--border-dim);
    }
    .tp-section-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
    .tp-title { font-size: 0.82rem; font-weight: 800; color: #a0c0ff; letter-spacing: .06em; }
    .tp-subtitle { font-size: 0.7rem; color: var(--muted); }
    .match-card.tp-card {
      position: relative; display: inline-flex; flex-direction: column;
      animation: none;
    }
    .match-card.tp-card.active-tp {
      border-color: rgba(160,192,255,.6);
      box-shadow: 0 0 0 1px rgba(160,192,255,.15), 0 0 18px rgba(160,192,255,.1);
      animation: pulseTP 2s ease-in-out infinite;
    }
    @keyframes pulseTP {
      0%,100% { box-shadow: 0 0 0 1px rgba(160,192,255,.15), 0 0 18px rgba(160,192,255,.1); }
      50%      { box-shadow: 0 0 0 1px rgba(160,192,255,.3),  0 0 28px rgba(160,192,255,.18); }
    }
    .p-slot.tp-slot.clickable:hover, .p-slot.tp-slot.clickable:active { background: rgba(160,192,255,.08); }
    .p-slot.tp-slot.clickable:hover .p-name, .p-slot.tp-slot.clickable:active .p-name { color: #a0c0ff; }
    .p-slot.winner.tp-slot { background: linear-gradient(90deg,rgba(160,192,255,.13),transparent); }
    .p-slot.winner.tp-slot .p-name { color: #a0c0ff; font-weight: 700; }
    .p-slot.winner.tp-slot .score-badge { color: #a0c0ff; }
    .btn-undo {
      position: absolute; top: 50%; right: 6px;
      transform: translateY(-50%);
      width: 22px; height: 22px; padding: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,60,60,.08); border: 1px solid rgba(255,100,100,.18);

      font-family: inherit; z-index: 5;
    }
    .btn-undo:hover {
      background: rgba(255,60,60,.22); border-color: rgba(255,80,80,.55);
      color: #ff8888; transform: translateY(-50%) rotate(-40deg);
      box-shadow: 0 0 8px rgba(255,60,60,.25);
    }

    /* 履歴エリア */
    #area-h { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 24px; display: none; }
    #area-h.visible { display: block; }
    .history-empty { color: var(--muted); font-size: 0.84rem; text-align: center; padding: 40px 0; }
    /* ブラケットスナップ */
    .hist-section-title { font-size: 0.72rem; font-weight: 700; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
    .hist-bracket-scroll { overflow-x: auto; padding: 16px 0 8px; -webkit-overflow-scrolling: touch; }
    .hist-log-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .btn-hist-clear {
      font-size: 0.72rem; padding: 4px 10px; border-radius: 6px;
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1);
      color: var(--muted); cursor: pointer; transition: all .15s; font-family: inherit;
    }
    .btn-hist-clear:hover { background: rgba(255,50,50,.15); border-color: rgba(255,80,80,.35); color: #ff8888; }
    /* 試合ログ */
    .history-group { margin-bottom: 4px; }
    .history-round-lbl {
      font-size: 0.65rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;

    .h-score  { color: #5a5a7a; font-size: 0.78rem; flex-shrink: 0; min-width: 38px; text-align: center; background: rgba(255,255,255,.04); border-radius: 4px; padding: 1px 5px; }

    /* Bye auto-label */

    #canvas-w, #canvas-l { position: absolute; top: 0; left: 0; pointer-events: none; }

    /* ━━━━ RESPONSIVE ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

      .setup-panel { padding: 24px 18px; }

      .winner-box { padding: 36px 22px 32px; }
      /* ナビ：1行、タブ非表示・ハンバーガー表示 */
      .nav { flex-wrap: nowrap; padding: 8px 10px; gap: 6px; }
      .btn-back { padding: 6px 8px; font-size: .72rem; }
      .save-status { display: none; }
      .tab-group { display: none; }       /* タブを非表示 */
      .btn-hamburger { display: block; }  /* ハンバーガー表示 */
    }
  </style>
</head>
<body>

<!-- ── SETUP ─────────────────────────────────── -->
<div id="setup">
  <div class="hero">
    <span class="hero-icon">🏆</span>
    <h1 class="hero-title">TOURNAMENT</h1>
    <p class="hero-sub" id="hero-sub">Single Elimination</p>
  </div>

  <div class="setup-panel">
    <div class="setup-main">
      <div class="setup-controls">
        <div class="mode-toggle">
          <button class="mode-btn active" id="btn-singles" onclick="setMode(false)">🎾 シングルス</button>
          <button class="mode-btn" id="btn-doubles" onclick="setMode(true)">👥 ダブルス</button>
        </div>

        <label class="lbl" id="lbl-count">参加者数</label>
        <div class="field-row">
          <input type="number" id="num-p" class="input input-num" min="2" max="100" value="8" oninput="handleCountInput()" onchange="updateInputs()">
          <button class="btn btn-ghost btn-count-sync" onclick="updateInputs()">反映</button>
        </div>

        <!-- 奇数時: 不戦勝選手 -->
        <div class="bye-section" id="bye-section">
          <p class="lbl" id="bye-lbl">🎫 シード選手（1名が第1ラウンド免除）</p>
          <div class="bye-mode-toggle">
            <button class="bye-mode-btn active" id="bye-random-btn" onclick="setByeMode('random')">🎲 ランダム</button>
            <button class="bye-mode-btn"        id="bye-pick-btn"   onclick="setByeMode('pick')">👤 選手を指定</button>
          </div>
          <p class="bye-random-note" id="bye-random-note">シャッフル後にランダムでシード選手が決まります</p>
          <select class="bye-select" id="bye-select" style="display:none;"></select>
        </div>
      </div>

      <div class="setup-roster">
        <label class="lbl" id="lbl-names">参加者名</label>
        <div class="names-scroll" id="names-list"></div>

        <!-- ダブルス: ランダムペア作成 -->
        <button class="btn-randomize" id="btn-randomize" onclick="randomizePairs()">🎲 ランダムでペアを作る</button>
        <div class="pairs-preview" id="pairs-preview">
          <div class="pairs-preview-hdr">ペア確認 — 再度タップで再シャッフル 🔀</div>
        </div>

        <button class="btn btn-start" id="btn-start" onclick="startTournament()">トーナメント開始 →</button>
      </div>
    </div>
  </div>
</div>

<!-- ── TOURNAMENT ─────────────────────────────── -->
<div id="tournament">
  <div class="nav">
    <button class="btn btn-ghost btn-back" onclick="backToSetup()" title="大会をリセットして設定画面に戻ります">大会リセット</button>
    <span class="nav-brand" id="nav-brand">🏆 <b>TOURNAMENT</b></span>
    <span class="save-status" id="save-status" title="この端末のブラウザに大会状態を自動保存します">自動保存</span>
    <div class="tab-group">
      <button class="tab-btn active-w" id="tab-w" onclick="showTab('w')">🏆<span class="tab-txt"> トーナメント</span></button>
      <button class="tab-btn" id="tab-l" onclick="showTab('l')">💗<span class="tab-txt"> 敗者トーナメント</span> <span class="tab-badge" id="tab-badge">準備中</span></button>
      <button class="tab-btn" id="tab-h" onclick="showTab('h')">📋<span class="tab-txt"> 履歴</span></button>
    </div>
    <!-- ハンバーガーボタン（スマホのみ） -->
    <button class="btn-hamburger" id="btn-hamburger" onclick="toggleMenu()" aria-label="メニュー">☰</button>
  </div>
  <!-- ハンバーガードロップダウン -->
  <div class="hamburger-menu" id="hamburger-menu">
    <button class="hmenu-item" id="hmenu-w" onclick="menuTab('w')">
      <span class="hmenu-icon">🏆</span><span class="hmenu-name">トーナメント</span>
    </button>
    <button class="hmenu-item" id="hmenu-l" onclick="menuTab('l')">
      <span class="hmenu-icon">💗</span><span class="hmenu-name">敗者トーナメント</span>
      <span class="hmenu-badge" id="hmenu-badge">準備中</span>
    </button>
    <button class="hmenu-item" id="hmenu-h" onclick="menuTab('h')">
      <span class="hmenu-icon">📋</span><span class="hmenu-name">履歴</span>
    </button>
  </div>
  <div class="hamburger-backdrop" id="hamburger-backdrop" onclick="closeMenu()"></div>

  <div class="bracket-wrap">
    <!-- 勝者ブラケット -->
    <div class="bracket-area visible" id="area-w">
      <div id="bracket-w"><canvas id="canvas-w"></canvas></div>
      <!-- 3位決定戦 -->
      <div id="third-place-section" style="display:none;">
        <div class="tp-section-header">
          <span class="tp-title">🥉 3位決定戦</span>
        </div>
        <div id="third-place-card-wrap"></div>
      </div>
    </div>
    <!-- 敗者ブラケット -->
    <div class="bracket-area" id="area-l">
      <div id="bracket-l"><canvas id="canvas-l"></canvas></div>
      <div class="losers-pending" id="losers-pending">
        <span class="losers-pending-icon">⏳</span>
        <p>トーナメントで敗者が出次第<br>敗者トーナメントが始まります</p>
      </div>
    </div>
    <!-- 履歴 -->
    <div id="area-h">
      <!-- トーナメント表スナップショット -->
      <div id="hist-bracket-section" style="display:none;">
        <div class="hist-section-title">📊 トーナメント表</div>
        <div class="hist-bracket-scroll">
          <div id="hist-bw" style="position:relative;display:inline-block;pointer-events:none;"></div>
        </div>
        <div style="border-top:1px solid var(--border-dim); margin:16px 0 0;"></div>
      </div>
      <!-- 試合ログ -->
      <div class="hist-log-header">
        <span class="hist-section-title">📋 試合ログ</span>
        <button class="btn-hist-clear" id="btn-hist-clear" onclick="clearHistory()">🗑 全削除</button>
      </div>
      <div id="history-list"><p class="history-empty">まだ試合結果がありません</p></div>
    </div>
  </div>

  <div id="winner-wrap">
    <div class="winner-box">
      <span class="w-trophy">🏆</span>
      <p class="w-eyebrow" id="w-eyebrow">Champion</p>
      <p class="w-name" id="w-name"></p>
      <p class="w-sub">おめでとうございます！</p>
      <div class="winner-btns">
        <button class="btn-see-bracket" onclick="closeWinner()">📋 トーナメント表を見る</button>
        <button class="btn-restart" onclick="backToSetup()">もう一度プレイ</button>
      </div>
    </div>
  </div>
</div>

<script>
// ── Constants ──────────────────────────────────────────────
const BYE      = { name: '—', isBye: true };
const TBD      = { name: '待機中', isTBD: true }; // 敗者確定待ちスロット
const MATCH_W  = 200;
const MATCH_WD = 222; // doubles
const ROUND_GAP = 58;
const LABEL_H   = 28;
const STORAGE_KEY = 'tournament-state-v1';

// ── State ─────────────────────────────────────────────────
let isDoubles    = false;
let currentPairs = [];
let winners      = null; // { rounds }
let losers       = null; // { rounds } or null
let thirdPlace   = null; // { p1, p2, winner, s1, s2 } 3位決定戦
let activeTab    = 'w';
let matchHistory = []; // { time, bracketId, ri, mi, winner, loser, s1, s2 }
let countUpdateTimer = null;

// ── Persistence ───────────────────────────────────────────
function isRealPlayer(player) {
  return !!player && !player.isBye && !player.isTBD;
}

function samePlayer(a, b) {
  if (!a || !b) return false;
  if (a.isBye && b.isBye) return true;
  if (a.isTBD && b.isTBD) return true;
  return a.id !== undefined && b.id !== undefined
    ? a.id === b.id && a.name === b.name
    : a.name === b.name;
}

function revivePlayer(player) {
  if (!player) return null;
  if (player.isBye) return BYE;
  return { ...player };
}

function reviveWinner(winner, p1, p2) {
  if (!winner) return null;
  if (winner.isBye) return BYE;
  if (samePlayer(winner, p1)) return p1;
  if (samePlayer(winner, p2)) return p2;
  return revivePlayer(winner);
}

function reviveRounds(savedRounds) {
  if (!Array.isArray(savedRounds)) return [];
  return savedRounds.map(rd => rd.map(m => {
    const p1 = revivePlayer(m.p1);
    const p2 = revivePlayer(m.p2);
    return {
      p1, p2,
      winner: reviveWinner(m.winner, p1, p2),
      s1: m.s1 ?? '',
      s2: m.s2 ?? ''
    };
  }));
}

function saveState() {
  if (!winners) return;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      version: 1,
      isDoubles,
      currentPairs,
      winners,
      losers,
      thirdPlace,
      activeTab,
      matchHistory
    }));
    updateSaveStatus('端末に保存済み', 'saved');
  } catch (err) {
    updateSaveStatus('保存失敗', 'error');
    console.warn('Tournament state could not be saved.', err);
  }
}

function clearSavedState() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
  updateSaveStatus('自動保存', '');
}

function updateSaveStatus(text, stateClass) {
  const el = document.getElementById('save-status');
  if (!el) return;
  el.textContent = text;
  el.title = 'この端末のブラウザに大会状態を自動保存します';
  el.className = 'save-status' + (stateClass ? ` ${stateClass}` : '');
}

function restoreState() {
  let saved;
  try {
    saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
  } catch (_) {
    clearSavedState();
    return false;
  }
  if (!saved || !saved.winners?.rounds) return false;

  isDoubles = !!saved.isDoubles;
  currentPairs = Array.isArray(saved.currentPairs) ? saved.currentPairs : [];
  winners = { rounds: reviveRounds(saved.winners.rounds) };
  losers = saved.losers?.rounds ? { rounds: reviveRounds(saved.losers.rounds) } : null;
  thirdPlace = reviveThirdPlace(saved.thirdPlace);
  activeTab = ['w', 'l', 'h'].includes(saved.activeTab) ? saved.activeTab : 'w';
  matchHistory = Array.isArray(saved.matchHistory) ? saved.matchHistory : [];

  syncModeUi();
  document.getElementById('setup').style.display = 'none';
  document.getElementById('winner-wrap').style.display = 'none';
  document.getElementById('tournament').style.display = 'flex';
  const brand = document.getElementById('nav-brand');
  brand.innerHTML = `🏆 <b${isDoubles?' class="d"':''}>TOURNAMENT</b>`;
  showTab(activeTab);
  renderAll();
  renderHistory();
  checkAllDone();
  updateSaveStatus('保存データ復元', 'restored');
  return true;
}

function reviveThirdPlace(saved) {
  if (!saved) return null;
  const p1 = revivePlayer(saved.p1);
  const p2 = revivePlayer(saved.p2);
  return {
    p1, p2,
    winner: reviveWinner(saved.winner, p1, p2),
    s1: saved.s1 ?? '',
    s2: saved.s2 ?? ''
  };
}

// ── Layout ────────────────────────────────────────────────
function lp(N0) {
  const mw   = isDoubles ? MATCH_WD : MATCH_W;
  // slotH: スコア入力(34px)+padding(8×2=16px)=最低50px / ダブルス2行で52px
  const slotH = Math.max(isDoubles ? 52 : 50, Math.min(isDoubles ? 64 : 60, Math.floor(520/N0)));
  const matchH = slotH * 2 + 2;
  // gap: カード間余白（最低18px確保）
  const gap    = Math.max(18, Math.min(40, Math.floor(220/N0)));
  return { slotH, matchH, gap, unit: matchH+gap, mw };
}

// ── Mode ──────────────────────────────────────────────────
function syncModeUi() {
  document.getElementById('btn-singles').classList.toggle('active', !isDoubles);
  document.getElementById('btn-doubles').classList.toggle('active',  isDoubles);
  document.getElementById('btn-doubles').classList.toggle('d',       isDoubles);
  document.getElementById('hero-sub').textContent = isDoubles ? 'Doubles Elimination' : 'Single Elimination';
  document.getElementById('hero-sub').classList.toggle('is-doubles', isDoubles);
  document.getElementById('lbl-count').textContent = isDoubles ? '参加人数（偶数）' : '参加者数';
  document.getElementById('lbl-names').textContent = isDoubles ? '参加者名（個人）' : '参加者名';
  document.getElementById('btn-start').classList.toggle('d', isDoubles);
  document.getElementById('btn-start').textContent = isDoubles ? 'ダブルストーナメント開始 →' : 'トーナメント開始 →';
  document.getElementById('btn-randomize').style.display = isDoubles ? 'block' : 'none';
}

function setMode(dbl) {
  isDoubles = dbl;
  syncModeUi();
  document.getElementById('pairs-preview').style.display = 'none';
  currentPairs = [];
  updateInputs();
}

// ── Setup ─────────────────────────────────────────────────
function updateInputs() {
  clearTimeout(countUpdateTimer);
  let n = Math.max(2, Math.min(100, +document.getElementById('num-p').value || 8));
  if (isDoubles && n % 2 !== 0) n++;
  document.getElementById('num-p').value = n;

  const list = document.getElementById('names-list');
  const prev = [...list.querySelectorAll('.inp-s')].map(i => i.value);
  list.innerHTML = '';

  for (let i = 0; i < n; i++) {
    const row = document.createElement('div');
    row.className = 'name-row';
    const ph = isDoubles ? `選手 ${i+1}` : `参加者 ${i+1}`;
    row.innerHTML = `<span class="name-idx">${i+1}</span>
      <input type="text" class="input inp-s" placeholder="${ph}" value="${h(prev[i]||'')}"
        oninput="handleNameInput()">`;
    list.appendChild(row);
  }

  // 奇数判定: ダブルスは偶数強制なので不要
  // 奇数のときだけbye-sectionを表示
  const odd = !isDoubles && (n % 2 !== 0);
  document.getElementById('bye-section').style.display = odd ? 'block' : 'none';
  if (odd) {
    // シード人数（numByes = 次の2のべき乗 - n）を計算して表示
    let sz = 1; while (sz < n) sz <<= 1;
    const nb = sz - n;
    const byeLbl = document.getElementById('bye-lbl');
    if (byeLbl) {
      byeLbl.textContent = nb === 1
        ? '🎫 シード選手（1名が第1ラウンド免除）'
        : `🎫 シード選手（${nb}名が第1ラウンド免除）`;
    }
    const byeNote = document.getElementById('bye-random-note');
    if (byeNote) {
      byeNote.textContent = nb === 1
        ? 'シャッフル後にランダムでシード選手が決まります'
        : `シャッフル後にランダムで${nb}名がシードになります`;
    }
    if (byeMode === 'pick') buildByeSelect(n);
  }

  document.getElementById('pairs-preview').style.display = 'none';
  currentPairs = [];
}

function handleCountInput() {
  clearTimeout(countUpdateTimer);
  const raw = document.getElementById('num-p').value;
  const n = +raw;
  if (raw === '' || !Number.isFinite(n) || n < 2) return;
  countUpdateTimer = setTimeout(updateInputs, 180);
}

function handleNameInput() {
  refreshByeSelect();
  if (!isDoubles || currentPairs.length === 0) return;
  currentPairs = [];
  const preview = document.getElementById('pairs-preview');
  preview.innerHTML = '<div class="pairs-preview-hdr">名前が変更されました。もう一度ペアを作ってください 🔀</div>';
  preview.style.display = 'flex';
}

// ── 不戦勝モード（ランダム／指定） ────────────────────────
let byeMode = 'random'; // 'random' | 'pick'

function setByeMode(mode) {
  byeMode = mode;
  document.getElementById('bye-random-btn').classList.toggle('active', mode === 'random');
  document.getElementById('bye-pick-btn').classList.toggle('active', mode === 'pick');
  document.getElementById('bye-random-note').style.display = mode === 'random' ? '' : 'none';
  document.getElementById('bye-select').style.display      = mode === 'pick'   ? '' : 'none';
  if (mode === 'pick') buildByeSelect(+document.getElementById('num-p').value);
}

function buildByeSelect(n) {
  const sel = document.getElementById('bye-select');
  const prev = sel.value;
  sel.innerHTML = '';
  const inputs = [...document.querySelectorAll('#names-list .inp-s')];
  for (let i = 0; i < n; i++) {
    const name = inputs[i]?.value.trim() || `参加者 ${i+1}`;
    const opt  = document.createElement('option');
    opt.value = i;
    opt.textContent = `${i+1}. ${name}`;
    sel.appendChild(opt);
  }
  if (prev !== '') sel.value = prev;
}

function refreshByeSelect() {
  const n = +document.getElementById('num-p').value;
  if (!isDoubles && n % 2 !== 0 && byeMode === 'pick') buildByeSelect(n);
}

function randomizePairs() {
  const inputs  = [...document.querySelectorAll('#names-list .inp-s')];
  const names   = inputs.map((el, i) => el.value.trim() || `選手 ${i+1}`);
  const shuffled = [...names];
  shuffle(shuffled);

  currentPairs = [];
  for (let i = 0; i < shuffled.length; i += 2)
    currentPairs.push([shuffled[i], shuffled[i+1] || `選手 ${i+2}`]);

  const preview = document.getElementById('pairs-preview');
  preview.innerHTML = '<div class="pairs-preview-hdr">ペア確認 — 再度タップで再シャッフル 🔀</div>';
  currentPairs.forEach(([a, b], i) => {
    const row = document.createElement('div');
    row.className = 'pair-row';
    row.innerHTML = `<span class="pair-num">${i+1}</span>
      <span class="pair-names">${h(a)}<span class="pair-slash">/</span>${h(b)}</span>`;
    preview.appendChild(row);
  });
  preview.style.display = 'flex';
}

function startTournament() {
  let players;
  if (isDoubles) {
    if (currentPairs.length === 0) randomizePairs();
    players = currentPairs.map(([a, b], i) => ({
      name: `${a} / ${b}`, pairA: a, pairB: b, id: i, isTeam: true
    }));
  } else {
    const inputs = [...document.querySelectorAll('#names-list .inp-s')];
    players = inputs.map((el, i) => ({ name: el.value.trim() || `参加者 ${i+1}`, id: i }));
  }

  shuffle(players);

  // 奇数 & 指定モード: 選択した選手を「最後のシードスロット」に配置
  // → ブラケット上で実試合の直上に来て、R1で実試合の勝者と当たれるポジション
  if (!isDoubles && players.length % 2 !== 0 && byeMode === 'pick') {
    const byeIdxRaw = document.getElementById('bye-select').value;
    const byeIdx    = byeIdxRaw !== '' ? +byeIdxRaw : -1;
    const idx = byeIdx >= 0 ? players.findIndex(p => p.id === byeIdx) : -1;
    if (idx >= 0) {
      // numByes を計算
      let sz = 1; while (sz < players.length) sz <<= 1;
      const numByes = sz - players.length;
      // 最後のシード枠（players[numByes-1]）に指定選手を配置
      const target = numByes - 1;
      if (idx !== target) {
        const t = players[target]; players[target] = players[idx]; players[idx] = t;
      }
    }
    // idx===-1: 選択なし/不正値 → シャッフル後の先頭がシード
  }
  // ランダムモードはシャッフル後の先頭がそのまま不戦勝

  initBracket(players, 'winners');
  losers = null;
  thirdPlace = null;
  matchHistory = [];
  preInitLosers(); // 敗者ブラケットをTBDで先行構築
  updateLosersTab();

  const brand = document.getElementById('nav-brand');
  brand.innerHTML = `🏆 <b${isDoubles?' class="d"':''}>TOURNAMENT</b>`;

  showTab('w');
  document.getElementById('setup').style.display      = 'none';
  document.getElementById('winner-wrap').style.display = 'none';
  document.getElementById('tournament').style.display  = 'flex';
  renderAll();
  saveState();
}

function backToSetup() {
  clearSavedState();
  document.getElementById('tournament').style.display = 'none';
  document.getElementById('setup').style.display = 'flex';
  winners = null;
  losers = null;
  currentPairs = [];
  matchHistory = [];
  thirdPlace = null;
  document.getElementById('pairs-preview').style.display = 'none';
  updateInputs();
}

// ── Bracket logic ─────────────────────────────────────────
function initBracket(players, target) {
  let size = 1;
  while (size < players.length) size <<= 1;
  const numByes = size - players.length;

  const slots = [];
  for (let i = 0; i < numByes; i++) slots.push(players[i], BYE);
  for (let i = numByes; i < players.length; i++) slots.push(players[i]);

  const rounds = [];
  let cur = slots;
  while (cur.length >= 2) {
    const rd = [];
    for (let i = 0; i < cur.length; i += 2)
      rd.push({ p1: cur[i], p2: cur[i+1], winner: null, s1: '', s2: '' });
    rounds.push(rd);
    cur = new Array(cur.length >> 1).fill(null);
  }

  if (target === 'winners') winners = { rounds };
  else                       losers  = { rounds };

  autoByes(target === 'winners' ? winners.rounds : losers.rounds);
}

function autoByes(rounds) {
  let changed = true;
  while (changed) {
    changed = false;
    rounds.forEach((rd, ri) => {
      rd.forEach((m, mi) => {
        if (m.winner !== null) return;
        const b1 = m.p1 === BYE, b2 = m.p2 === BYE;
        const r1 = isRealPlayer(m.p1), r2 = isRealPlayer(m.p2);
        if (b1 && b2)      { adv(rounds, ri, mi, BYE);   changed = true; }
        else if (b1 && r2) { adv(rounds, ri, mi, m.p2); changed = true; }
        else if (r1 && b2) { adv(rounds, ri, mi, m.p1); changed = true; }
      });
    });
  }
}

function adv(rounds, ri, mi, player) {
  rounds[ri][mi].winner = player;
  if (ri + 1 < rounds.length) {
    const nm = rounds[ri+1][mi>>1];
    if (mi % 2 === 0) nm.p1 = player; else nm.p2 = player;
  }
}

function pick(rounds, ri, mi, player, bracketId) {
  const m = rounds[ri][mi];
  if (m.winner || !isRealPlayer(player)) return;
  const loser = m.p1 === player ? m.p2 : m.p1;
  // 履歴に追加
  matchHistory.push({
    id: Date.now() + '_' + ri + '_' + mi,
    time: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
    bracketId, ri, mi,
    winner: player.name,
    loser:  loser?.name ?? '—',
    s1: m.s1, s2: m.s2
  });
  adv(rounds, ri, mi, player);
  autoByes(rounds);
  if (bracketId === 'w') { tryBuildLosers(); updateThirdPlace(); }
  renderAll();
  renderHistory();
  checkWinner(bracketId);
  saveState();
}

// ── スコア入力 ────────────────────────────────────────────
function storeScore(bracketId, ri, mi, slot, val) {
  const rounds = bracketId === 'w' ? winners.rounds : losers.rounds;
  const m = rounds[ri][mi];
  if (slot === 1) m.s1 = val; else m.s2 = val;

  // 両方入力済 & 異なる → 自動選択（高スコアが勝ち）
  const s1 = parseFloat(m.s1), s2 = parseFloat(m.s2);
  if (!isNaN(s1) && !isNaN(s2) && s1 !== s2 && !m.winner) {
    const w = s1 > s2 ? m.p1 : m.p2;
    const bothReal = isRealPlayer(m.p1) && isRealPlayer(m.p2);
    if (isRealPlayer(w) && bothReal) {
      pick(rounds, ri, mi, w, bracketId);
      return;
    }
  }
  // スコアはm.s1/s2に保持済み。入力中に再描画するとフォーカスが外れるため再描画しない。
  // 自動勝者選択(上のpick)時のみ再描画される。
  saveState();
}

// ── 敗者ブラケット ────────────────────────────────────────

// ビリ決定戦の参加者数:
// 全参加者 - 優勝者(1) - 準優勝者(1) - 3位決定戦の2人 = n - 4
// ※準決勝・決勝の4人はビリに入らない
function countTotalExpectedLosers() {
  if (!winners) return 0;
  const R = winners.rounds.length;
  let n = 0;
  winners.rounds[0].forEach(m => {
    if (isRealPlayer(m.p1)) n++;
    if (isRealPlayer(m.p2)) n++;
  });
  // ラウンド数が2以上なら準決勝・決勝の4人を除外
  return R >= 2 ? Math.max(0, n - 4) : Math.max(0, n - 1);
}

// ビリ決定戦用の敗者収集（準決勝・決勝の敗者は除外）
function collectAllLosers() {
  if (!winners) return [];
  const R = winners.rounds.length;
  const arr = [];
  winners.rounds.forEach((rd, ri) => {
    // 準決勝(R-2)と決勝(R-1)の敗者はビリに入れない（3位決定戦・2位扱い）
    if (R >= 2 && ri >= R - 2) return;
    rd.forEach(m => {
      if (isRealPlayer(m.winner)) {
        const loser = m.p1 === m.winner ? m.p2 : m.p1;
        if (isRealPlayer(loser)) arr.push(loser);
      }
    });
  });
  return arr;
}

// TBDスロットで敗者ブラケットを先行構築（トーナメント開始時に呼ぶ）
function preInitLosers() {
  const n = countTotalExpectedLosers();
  if (n < 2) return;
  const tbds = Array.from({ length: n }, () => ({ ...TBD }));
  initBracket(tbds, 'losers');
}

// 既知の敗者＋残りTBDでブラケットをゼロから再構築（共通処理）
function rebuildLosersFromKnown(knownLosers) {
  const total = countTotalExpectedLosers();
  if (total < 2) { losers = null; updateLosersTab(); return; }
  const slots = Array.from({ length: total }, (_, i) =>
    i < knownLosers.length ? knownLosers[i] : { ...TBD });
  initBracket(slots, 'losers');
}

// 敗者が出るたびに随時反映（全ラウンド対応）
function tryBuildLosers() {
  if (!winners) return;
  const knownLosers = collectAllLosers(); // ← 全ラウンドから収集
  if (knownLosers.length === 0) return;

  // 敗者ブラケットにまだ試合結果がない → ゼロから再構築
  const hasPlayed = losers?.rounds?.some(rd =>
    rd.some(m => isRealPlayer(m.winner) && isRealPlayer(m.p1) && isRealPlayer(m.p2)));
  if (!hasPlayed) {
    rebuildLosersFromKnown(knownLosers);
  } else {
    // 既プレイ済みがある場合: TBDオブジェクトをin-placeで書き換え
    // （参照共有のため上位ラウンドにも自動反映される）
    let li = 0;
    for (const m of losers.rounds[0]) {
      if (m.p1?.isTBD && li < knownLosers.length) {
        Object.assign(m.p1, knownLosers[li++], { isTBD: false });
      } else if (isRealPlayer(m.p1)) { li++; }
      if (m.p2?.isBye) continue;
      if (m.p2?.isTBD && li < knownLosers.length) {
        Object.assign(m.p2, knownLosers[li++], { isTBD: false });
      } else if (isRealPlayer(m.p2)) { li++; }
    }
  }
  updateLosersTab();
}

// 取り消し後の敗者ブラケット再構築
function rebuildLosersAfterUndo() {
  const knownLosers = collectAllLosers();
  losers = null;
  cancelHistoryEntries(e => e.bracketId === 'l', '勝者表の取り消しで無効');
  rebuildLosersFromKnown(knownLosers);
}

// ── 3位決定戦 ─────────────────────────────────────────────

// 準決勝の敗者を収集
function collectSemiLosers() {
  if (!winners) return [];
  const R = winners.rounds.length;
  if (R < 2) return [];
  const arr = [];
  winners.rounds[R - 2].forEach(m => {
    if (isRealPlayer(m.winner)) {
      const loser = m.p1 === m.winner ? m.p2 : m.p1;
      if (isRealPlayer(loser)) arr.push(loser);
    }
  });
  return arr;
}

// 3位決定戦データを更新
function updateThirdPlace() {
  const R = winners?.rounds?.length ?? 0;
  if (R < 2) { thirdPlace = null; render3rdPlace(); return; }
  const semiLosers = collectSemiLosers();
  if (semiLosers.length < 2) {
    // 準決勝未完了 or 取り消し → 結果をリセット（試合自体は維持）
    if (thirdPlace && thirdPlace.winner) {
      thirdPlace.winner = null; thirdPlace.s1 = ''; thirdPlace.s2 = '';
    }
    if (thirdPlace) { thirdPlace.p1 = semiLosers[0] || null; thirdPlace.p2 = semiLosers[1] || null; }
    render3rdPlace(); return;
  }
  if (!thirdPlace) {
    thirdPlace = { p1: semiLosers[0], p2: semiLosers[1], winner: null, s1: '', s2: '' };
  } else if (!thirdPlace.winner) {
    thirdPlace.p1 = semiLosers[0]; thirdPlace.p2 = semiLosers[1];
  }
  render3rdPlace();
}

// 3位決定戦の勝者を確定
function pick3rd(player) {
  if (!thirdPlace || thirdPlace.winner) return;
  const loser = thirdPlace.p1 === player ? thirdPlace.p2 : thirdPlace.p1;
  thirdPlace.winner = player;
  matchHistory.push({
    id: Date.now() + '_3rd',
    time: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
    bracketId: '3rd', ri: 0, mi: 0,
    winner: player.name, loser: loser?.name ?? '—',
    s1: thirdPlace.s1, s2: thirdPlace.s2
  });
  render3rdPlace();
  renderHistory();
  checkAllDone();
  saveState();
}

// 3位決定戦の取り消し
function undo3rd() {
  if (!thirdPlace || !thirdPlace.winner) return;
  cancelHistoryEntry('3rd', 0, 0);
  thirdPlace.winner = null; thirdPlace.s1 = ''; thirdPlace.s2 = '';
  render3rdPlace(); renderHistory();
  saveState();
}

// 3位決定戦スコア保存
function storeScore3rd(slot, val) {
  if (!thirdPlace) return;
  if (slot === 1) thirdPlace.s1 = val; else thirdPlace.s2 = val;
  const s1 = parseFloat(thirdPlace.s1), s2 = parseFloat(thirdPlace.s2);
  if (!isNaN(s1) && !isNaN(s2) && s1 !== s2 && !thirdPlace.winner) {
    pick3rd(s1 > s2 ? thirdPlace.p1 : thirdPlace.p2);
    return;
  }
  saveState();
}

// 3位決定戦の描画
function render3rdPlace() {
  const section = document.getElementById('third-place-section');
  const wrap    = document.getElementById('third-place-card-wrap');
  if (!section || !wrap) return;
  const m = thirdPlace;
  if (!m || (!m.p1 && !m.p2)) { section.style.display = 'none'; return; }
  section.style.display = '';
  wrap.innerHTML = '';

  const isDone  = !!m.winner;
  const bothReal = isRealPlayer(m.p1) && isRealPlayer(m.p2);
  const card = document.createElement('div');
  card.className = 'match-card tp-card' + (isDone ? ' done' : bothReal ? ' active-tp' : '');

  // hint removed
  card.appendChild(makeThirdPlaceSlot(m.p1, m, 1));
  card.appendChild(makeThirdPlaceSlot(m.p2, m, 2));

  if (isDone) {
    const ub = document.createElement('button');
    ub.className = 'btn-undo'; ub.title = '結果を取り消す'; ub.textContent = '↺';
    ub.addEventListener('click', e => { e.stopPropagation(); undo3rd(); });
    card.appendChild(ub);
  }
  wrap.appendChild(card);
}

function makeThirdPlaceSlot(player, m, slotNum) {
  const el = document.createElement('div');
  const isWinner = m.winner === player;
  const isLoser  = m.winner && m.winner !== player;
  const both = m.p1 && m.p2;
  const real = isRealPlayer(player);

  el.className = 'p-slot tp-slot';
  el.style.minHeight = '38px';

  if (!real) {
    el.classList.add('empty');
    el.innerHTML = '<span class="p-name">—</span>';
    return el;
  }
  if (isWinner) el.classList.add('winner');
  else if (isLoser) el.classList.add('loser');
  else if (both) {
    el.classList.add('clickable');
    el.title = `${player.name} が3位（勝者）`;
    el.addEventListener('click', () => {
      pick3rd(player);
    });
  }

  const crown = isWinner ? '<span class="p-crown">★</span>' : '';
  el.innerHTML = `<span class="p-name">${crown}${h(player.name)}</span>`;

  // スコア
  if (isWinner || isLoser) {
    const val = slotNum === 1 ? m.s1 : m.s2;
    const sb = document.createElement('span');
    sb.className = 'score-badge'; sb.textContent = val !== '' ? val : '–';
    el.appendChild(sb);
  } else {
    const val = slotNum === 1 ? m.s1 : m.s2;
    const inp = document.createElement('input');
    inp.type = 'number'; inp.className = 'score-input';
    inp.min = 0; inp.max = 99; inp.value = val !== '' ? val : ''; inp.placeholder = '-';
    const stop = e => e.stopPropagation();
    ['mousedown','click','touchstart','touchend'].forEach(ev => inp.addEventListener(ev, stop, { passive: ev==='touchstart' }));
    inp.addEventListener('input', e => { e.stopPropagation(); if(slotNum===1) thirdPlace.s1=e.target.value; else thirdPlace.s2=e.target.value; });
    inp.addEventListener('blur',  e => { e.stopPropagation(); storeScore3rd(slotNum, e.target.value); });
    el.appendChild(inp);
  }
  return el;
}

// 試合結果の取り消し（カスケード）
function undoPick(rounds, ri, mi, bracketId) {
  const m = rounds[ri][mi];
  if (!isRealPlayer(m.winner)) return;
  const prevWinner = m.winner;

  // 次ラウンドから再帰的に取り消し
  if (ri + 1 < rounds.length) {
    const nmi = mi >> 1;
    const nm  = rounds[ri + 1][nmi];
    if (nm.winner) undoPick(rounds, ri + 1, nmi, bracketId);
    if (mi % 2 === 0) nm.p1 = null; else nm.p2 = null;
  }

  cancelHistoryEntry(bracketId, ri, mi);

  m.winner = null;
  m.s1 = '';
  m.s2 = '';

  // 勝者ブラケットの取り消しなら敗者ブラケット・3位決定戦も再構築
  if (bracketId === 'w') { rebuildLosersAfterUndo(); updateThirdPlace(); }

  document.getElementById('winner-wrap').style.display = 'none';
  renderAll();
  renderHistory();
  saveState();
}

function cancelHistoryEntry(bracketId, ri, mi, reason = '結果を取り消し') {
  const idx = matchHistory.map((h,i)=>i).reverse()
    .find(i => !matchHistory[i].canceled &&
      matchHistory[i].bracketId === bracketId &&
      matchHistory[i].ri === ri &&
      matchHistory[i].mi === mi);
  if (idx !== undefined) markHistoryCanceled(matchHistory[idx], reason);
}

function cancelHistoryEntries(predicate, reason = '結果を取り消し') {
  matchHistory.forEach(e => {
    if (!e.canceled && predicate(e)) markHistoryCanceled(e, reason);
  });
}

function markHistoryCanceled(entry, reason) {
  entry.canceled = true;
  entry.cancelReason = reason;
  entry.canceledAt = new Date().toLocaleTimeString('ja-JP', {
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  });
}

function updateLosersTab() {
  const badge  = document.getElementById('tab-badge');
  const hbadge = document.getElementById('hmenu-badge');
  function syncBadge(text, bg, color) {
    badge.textContent  = text;
    badge.style.background = bg;   badge.style.color = color;
    if (hbadge) { hbadge.textContent = text; hbadge.style.background = bg; hbadge.style.color = color; }
  }
  if (!winners) { syncBadge('準備中', '', ''); return; }
  const known    = collectAllLosers().length;
  const expected = countTotalExpectedLosers();
  // 対象者0人（4人以下など）→ 敗者トーナメント不要
  if (expected === 0) {
    syncBadge('対象なし', 'rgba(100,100,100,.2)', 'rgba(160,160,160,.6)');
    // ペンディング表示を「対象なし」メッセージに更新
    const pending = document.getElementById('losers-pending');
    if (pending) {
      pending.querySelector('.losers-pending-icon').textContent = 'ℹ️';
      pending.querySelector('p').innerHTML = '参加者数が少ないため<br>敗者トーナメントはありません';
    }
    return;
  }
  if (known === 0) {
    syncBadge('準備中', '', '');
  } else if (known < expected) {
    syncBadge(`${known}/${expected}人`, 'rgba(255,123,114,.15)', 'rgba(255,123,114,.7)');
  } else {
    syncBadge('準備OK', 'rgba(255,123,114,.25)', 'var(--loss)');
  }
}

// ── 全トーナメント完了確認 ───────────────────────────────
function checkWinner(bracketId) { checkAllDone(); }

function checkAllDone() {
  // ウィナーズブラケット完了チェック
  if (!winners) return;
  const wLast = winners.rounds[winners.rounds.length - 1][0];
  if (!isRealPlayer(wLast.winner)) return;

  // 敗者トーナメントが存在する場合は完了チェック
  if (losers) {
    const lLast = losers.rounds[losers.rounds.length - 1][0];
    if (!isRealPlayer(lLast.winner)) return;
  }

  // 3位決定戦が存在する場合は完了チェック
  if (thirdPlace && !thirdPlace.winner) return;

  // すべて完了 → ポップアップ表示
  document.getElementById('w-eyebrow').textContent = 'Champion';

  const wName = document.getElementById('w-name');
  if (wLast.winner.isTeam) {
    wName.className = 'w-name d';
    wName.innerHTML = `<span class="w-pair-a">🤝 ${h(wLast.winner.pairA)}</span><span class="w-pair-b">${h(wLast.winner.pairB)}</span>`;
  } else {
    wName.className = 'w-name';
    wName.textContent = wLast.winner.name;
  }
  const wrap = document.getElementById('winner-wrap');
  wrap.style.display = 'flex';
  wrap.style.alignItems = 'flex-start';
  wrap.style.justifyContent = 'center';
}

function closeWinner() {
  document.getElementById('winner-wrap').style.display = 'none';
}

// ── Tab ──────────────────────────────────────────────────
function showTab(tab) {
  activeTab = tab;
  document.getElementById('area-w').classList.toggle('visible', tab === 'w');
  document.getElementById('area-l').classList.toggle('visible', tab === 'l');
  document.getElementById('area-h').classList.toggle('visible', tab === 'h');
  document.getElementById('tab-w').className = 'tab-btn' + (tab === 'w' ? ' active-w' : '');
  document.getElementById('tab-l').className = 'tab-btn' + (tab === 'l' ? ' active-l' : '');
  document.getElementById('tab-h').className = 'tab-btn' + (tab === 'h' ? ' active-h' : '');

  // 敗者ブラケットペンディング表示切替（losersがあれば隠す）
  const pending = document.getElementById('losers-pending');
  if (pending) pending.style.display = losers ? 'none' : 'flex';

  if (tab === 'l' && losers) renderBracket('l');
  if (tab === 'h') renderHistory();

  updateMenuActive();
  saveState();
}

// ── ハンバーガーメニュー ─────────────────────────────────
function toggleMenu() {
  const menu = document.getElementById('hamburger-menu');
  const backdrop = document.getElementById('hamburger-backdrop');
  if (menu.classList.contains('open')) {
    closeMenu();
  } else {
    const nav = document.querySelector('.nav');
    menu.style.top = nav.getBoundingClientRect().bottom + 'px';
    menu.classList.add('open');
    backdrop.classList.add('open');
    updateMenuActive();
  }
}

function closeMenu() {
  document.getElementById('hamburger-menu').classList.remove('open');
  document.getElementById('hamburger-backdrop').classList.remove('open');
}

function menuTab(tab) {
  showTab(tab);
  closeMenu();
}

function updateMenuActive() {
  ['w', 'l', 'h'].forEach(t => {
    const el = document.getElementById('hmenu-' + t);
    if (!el) return;
    el.classList.remove('hmenu-w', 'hmenu-l', 'hmenu-h');
    if (t === activeTab) el.classList.add('hmenu-' + t);
  });
}

// ── 履歴描画 ─────────────────────────────────────────────
function roundLabel(bracketId, ri) {
  if (bracketId === '3rd') return '3位決定戦';
  const rds = bracketId === 'w' ? winners?.rounds : losers?.rounds;
  const R = rds?.length || 1;
  if (bracketId === 'l') return `敗者 R${ri + 1}`;
  const fromEnd = R - 1 - ri;
  if (fromEnd === 0) return '決勝';
  if (fromEnd === 1) return '準決勝';
  if (fromEnd === 2) return '準々決勝';
  return `ROUND ${ri + 1}`;
}

function renderHistory() {
  const panel = document.getElementById('history-list');
  const bracketSection = document.getElementById('hist-bracket-section');
  const clearBtn = document.getElementById('btn-hist-clear');
  if (!panel) return;

  // トーナメント表スナップショット
  if (bracketSection) {
    if (winners && matchHistory.length > 0) {
      bracketSection.style.display = '';
      const hbw = document.getElementById('hist-bw');
      if (hbw) {
        hbw.innerHTML = '';
        renderBracket('w', 'hist-bw', 'hist-canvas-w');
      }
    } else {
      bracketSection.style.display = 'none';
    }
  }
  if (clearBtn) clearBtn.style.display = matchHistory.length > 0 ? '' : 'none';

  if (matchHistory.length === 0) {
    panel.innerHTML = '<p class="history-empty">まだ試合結果がありません</p>';
    return;
  }

  // ラウンド別グループ化
  const groups = new Map();
  matchHistory.forEach(e => {
    const key = `${e.bracketId}_${e.ri}`;
    if (!groups.has(key)) groups.set(key, { label: roundLabel(e.bracketId, e.ri), items: [] });
    groups.get(key).items.push(e);
  });

  let html = '';
  groups.forEach(g => {
    html += `<div class="history-group"><div class="history-round-lbl">${g.label}</div>`;
    g.items.forEach(e => {
      const scoreStr = (e.s1 !== '' && e.s2 !== '') ? `${e.s1} – ${e.s2}` : '–';
      const isCanceled = !!e.canceled;
      const badge = isCanceled ? '↺' : e.bracketId === 'w' ? '🏆' : e.bracketId === '3rd' ? '🥉' : '💔';
      const eid = String(e.id).replace(/[^a-z0-9_]/gi, '_');
      const scoreLabel = isCanceled ? '取消' : scoreStr;
      const winnerLabel = isCanceled ? `取消: ${h(e.winner)}` : `★ ${h(e.winner)}`;
      const reasonTitle = isCanceled ? h(e.cancelReason || '結果を取り消し') : '';
      html += `<div class="history-item${isCanceled ? ' canceled' : ''}" title="${reasonTitle}">
        <span class="h-time">${e.time}</span>
        <span class="h-badge">${badge}</span>
        <span class="h-winner">${winnerLabel}</span>
        <span class="h-score">${scoreLabel}</span>
        <span class="h-loser">vs ${h(e.loser)}</span>
        <button class="btn-hist-del" onclick="deleteHistory('${eid}')" title="削除">×</button>
      </div>`;
    });
    html += '</div>';
  });
  panel.innerHTML = html;
}

function deleteHistory(eid) {
  const idx = matchHistory.findIndex(e => String(e.id).replace(/[^a-z0-9_]/gi, '_') === eid);
  if (idx >= 0) { matchHistory.splice(idx, 1); renderHistory(); saveState(); }
}

function clearHistory() {
  matchHistory = [];
  renderHistory();
  saveState();
}

// ── Rendering ─────────────────────────────────────────────
function renderAll() {
  renderBracket('w');
  if (losers) renderBracket('l'); // TBDスロットも含めて常に描画
  updateLosersTab();
  render3rdPlace(); // 3位決定戦も常に最新状態に同期
  const pending = document.getElementById('losers-pending');
  if (pending) pending.style.display = losers ? 'none' : 'flex';
}

function rdLabel(ri, total) {
  const e = total - 1 - ri;
  if (e === 0) return '決勝';
  if (e === 1) return '準決勝';
  if (e === 2) return '準々決勝';
  return `ROUND ${ri+1}`;
}

function cy(ri, mi, unit, gap) {
  const g = 1 << ri;
  const t = mi * g * unit + LABEL_H;
  const b = t + g * unit - gap;
  return (t + b) / 2;
}

function renderBracket(bracketId, overrideContId, overrideCvId) {
  const rounds   = bracketId === 'w' ? winners?.rounds : losers?.rounds;
  if (!rounds) return;

  const contId = overrideContId || (bracketId === 'w' ? 'bracket-w' : 'bracket-l');
  const cvId   = overrideCvId  || (bracketId === 'w' ? 'canvas-w'  : 'canvas-l');
  const cont   = document.getElementById(contId);
  const isLoss = bracketId === 'l';

  cont.querySelectorAll('.match-card,.round-lbl,.bye-auto').forEach(e => e.remove());

  const R  = rounds.length;
  const N0 = rounds[0].length;
  const { matchH, gap, unit, mw } = lp(N0);

  const totalH = N0 * unit - gap + LABEL_H;
  const totalW = R * (mw + ROUND_GAP) - ROUND_GAP;

  cont.style.height = totalH + 'px';
  cont.style.width  = totalW + 'px';

  let cv = document.getElementById(cvId);
  if (!cv) {
    cv = document.createElement('canvas');
    cv.id = cvId;
    cv.style.cssText = 'position:absolute;top:0;left:0;pointer-events:none;';
    cont.insertBefore(cv, cont.firstChild);
  }
  const dpr = Math.min(window.devicePixelRatio || 1, 2); // 大人数時のcanvas肥大化を防止
  cv.width  = totalW * dpr;
  cv.height = totalH * dpr;
  cv.style.width  = totalW + 'px';
  cv.style.height = totalH + 'px';
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, totalW, totalH);

  const lineActive = isLoss ? 'rgba(255,123,114,.35)' : 'rgba(240,165,0,.35)';
  const lineDim    = 'rgba(30,30,46,.95)';

  const activeRound = rounds.findIndex(rd =>
    rd.some(m => !m.winner && isRealPlayer(m.p1) && isRealPlayer(m.p2))
  );

  rounds.forEach((rd, ri) => {
    const x = ri * (mw + ROUND_GAP);

    const lbl = document.createElement('div');
    lbl.className = 'round-lbl' + (ri === activeRound ? (isLoss ? ' cur-l' : ' cur-w') : '');
    lbl.style.cssText = `left:${x}px;top:0;width:${mw}px;`;
    lbl.textContent = rdLabel(ri, R);
    cont.appendChild(lbl);

    rd.forEach((m, mi) => {
      const centerY = cy(ri, mi, unit, gap);
      const topY    = centerY - matchH / 2;
      const isBye   = ri === 0 && (m.p1 === BYE || m.p2 === BYE);

      if (isBye) {
        const winner = m.p1 === BYE ? m.p2 : m.p1;
        if (isRealPlayer(winner)) {
          const el = document.createElement('div');
          el.className = 'bye-auto' + (isDoubles ? ' d' : '');
          el.style.cssText = `left:${x}px;top:${centerY-14}px;`;
          el.innerHTML = `<span class="bye-auto-name">${h(winner.name)}</span><span class="bye-auto-tag">シード</span>`;
          cont.appendChild(el);
        }
      } else {
        const bothReal = isRealPlayer(m.p1) && isRealPlayer(m.p2);
        const activeClass = m.winner ? 'done' : bothReal ? (isLoss ? 'active-l' : 'active-w') : '';
        const card = document.createElement('div');
        card.className = `match-card${isDoubles ? ' doubles-card' : ''} ${activeClass}`;
        card.style.cssText = `left:${x}px;top:${topY}px;`;
        // ビリ決定戦: 未確定の試合にヒントラベルを表示
        // hint removed
        card.appendChild(makeSlot(m.p1, m, ri, mi, matchH, bracketId, isLoss));
        card.appendChild(makeSlot(m.p2, m, ri, mi, matchH, bracketId, isLoss));
        // 完了試合に取り消しボタン
        if (isRealPlayer(m.winner)) {
          const undoBtn = document.createElement('button');
          undoBtn.className = 'btn-undo';
          undoBtn.title = '試合結果を取り消す';
          undoBtn.textContent = '↺';
          undoBtn.addEventListener('click', e => {
            e.stopPropagation();
            undoPick(bracketId === 'w' ? winners.rounds : losers.rounds, ri, mi, bracketId);
          });
          card.appendChild(undoBtn);
        }
        cont.appendChild(card);
      }

      // ライン
      if (ri < R - 1) {
        const x1   = x + mw;
        const midX = x1 + ROUND_GAP / 2;
        const ny   = cy(ri+1, mi>>1, unit, gap);
        const isAuto = m.p1 === BYE || m.p2 === BYE;
        const lc = isRealPlayer(m.winner) && !isAuto ? lineActive : lineDim;
        drawLine(ctx, x1, centerY, midX, centerY, lc);
        if (mi % 2 === 0) {
          const sibY = mi+1 < rd.length ? cy(ri, mi+1, unit, gap) : centerY;
          drawLine(ctx, midX, centerY, midX, sibY, lc);
          drawLine(ctx, midX, ny, x + mw + ROUND_GAP, ny, lc);
        }
      }
    });
  });
}

function makeSlot(player, m, ri, mi, matchH, bracketId, isLoss) {
  const el     = document.createElement('div');
  const slotH  = Math.floor((matchH - 2) / 2);
  const slot1  = player === m.p1; // 上スロットか
  const scoreVal = slot1 ? m.s1 : m.s2;
  const scoreSlotNum = slot1 ? 1 : 2;

  const real   = isRealPlayer(player);
  const both   = isRealPlayer(m.p1) && isRealPlayer(m.p2);

  el.className = 'p-slot' + (isLoss ? ' loss-bracket' : '');
  el.style.minHeight = slotH + 'px';

  if (!real) {
    el.classList.add('empty');
    el.innerHTML = player?.isTBD
      ? '<span class="p-name tbd">⏳ 待機中</span>'
      : '<span class="p-name">—</span>';
    return el;
  }

  const isWinner = m.winner === player;
  const isLoser  = m.winner && m.winner !== player;

  if (isWinner)       el.classList.add('winner');
  else if (isLoser)   el.classList.add('loser');
  else if (both) {
    el.classList.add('clickable');
    el.title = `${player.name} を勝者に選択`;
    el.addEventListener('click', () => {
      const rds = bracketId === 'w' ? winners.rounds : losers.rounds;
      const mm  = rds[ri][mi];
      // 両方のスコアが入力されていない場合は確定せず、入力を促す
      if (mm.s1 === '' || mm.s2 === '') {
        const card = el.closest('.match-card');
        if (card) {
          card.querySelectorAll('.score-input').forEach(inp => {
            if (inp.value === '') {
              inp.focus();
              inp.classList.add('score-required');
              setTimeout(() => inp.classList.remove('score-required'), 1200);
            }
          });
        }
        return;
      }
      pick(rds, ri, mi, player, bracketId);
    });
  }

  const crown = isWinner ? '<span class="p-crown">★</span>' : '';

  if (isDoubles && player.isTeam) {
    // ダブルス: 2行表示
    const scoreEl = makeScoreEl(m, ri, mi, scoreSlotNum, scoreVal, bracketId, isWinner, isLoser);
    el.innerHTML = `
      <div class="p-pair">
        <span class="p-pair-a">${h(player.pairA)}</span>
        <span class="p-pair-b">${h(player.pairB)}</span>
      </div>${crown}`;
    el.appendChild(scoreEl);
  } else {
    // シングルス
    const scoreEl = makeScoreEl(m, ri, mi, scoreSlotNum, scoreVal, bracketId, isWinner, isLoser);
    el.style.fontSize = slotH < 28 ? '0.76rem' : '0.86rem';
    el.innerHTML = `<span class="p-name">${h(player.name)}</span>${crown}`;
    el.appendChild(scoreEl);
  }
  return el;
}

function makeScoreEl(m, ri, mi, slotNum, val, bracketId, isWinner, isLoser) {
  if (isWinner || isLoser) {
    // 完了試合: バッジ表示（未入力でも「–」を表示）
    const span = document.createElement('span');
    span.className = 'score-badge';
    span.textContent = val !== '' ? val : '–';
    return span;
  }
  // 進行中: 入力欄
  const inp = document.createElement('input');
  inp.type      = 'number';
  inp.className = 'score-input';
  inp.min       = 0; inp.max = 99;
  inp.value     = val !== '' ? val : '';
  inp.placeholder = '-';
  // 伝播を止めて親スロットのclick(勝者選択)が誤発火しないようにする
  const stopAll = e => e.stopPropagation();
  inp.addEventListener('mousedown',  stopAll);
  inp.addEventListener('click',      stopAll);
  inp.addEventListener('touchstart', stopAll, { passive: true });
  inp.addEventListener('touchend',   stopAll);
  inp.addEventListener('input', e => {
    e.stopPropagation();
    // タイピング中はデータを保存するだけ（再描画・自動判定なし → 10が1にならない）
    const rds = bracketId === 'w' ? winners.rounds : losers.rounds;
    const mm  = rds[ri][mi];
    if (slotNum === 1) mm.s1 = e.target.value; else mm.s2 = e.target.value;
  });
  inp.addEventListener('blur', e => {
    // 入力確定後に自動勝者判定
    e.stopPropagation();
    storeScore(bracketId, ri, mi, slotNum, e.target.value);
  });
  return inp;
}

function drawLine(ctx, x1, y1, x2, y2, color) {
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

// ── Util ──────────────────────────────────────────────────
function shuffle(a) {
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
}
function h(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Init
if (!restoreState()) updateInputs();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
